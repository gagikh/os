<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="420" fill="#0d1117"/>
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2ea043"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f0883e"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Two ways into a board with no screen</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">Embedded boards usually run "headless": no monitor, no keyboard. You work on them from your PC.</text>

  <!-- PC -->
  <rect x="40" y="80" width="230" height="270" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <text x="155" y="108" text-anchor="middle" fill="#1f6feb" font-size="16" font-weight="bold">Your PC</text>
  <text x="155" y="126" text-anchor="middle" fill="#8b949e" font-size="11">Windows / Linux / macOS</text>
  <rect x="60" y="142" width="190" height="80" rx="6" fill="#21262d"/>
  <text x="72" y="162" fill="#8b949e" font-size="11">Terminal</text>
  <text x="72" y="184" fill="#e6edf3" font-size="11.5" font-family="Consolas, Menlo, monospace">$ ssh lab@192.168.1.50</text>
  <text x="72" y="204" fill="#e6edf3" font-size="11.5" font-family="Consolas, Menlo, monospace">lab@jetson:~$ _</text>
  <rect x="60" y="250" width="190" height="80" rx="6" fill="#21262d"/>
  <text x="72" y="270" fill="#8b949e" font-size="11">Serial terminal</text>
  <text x="72" y="292" fill="#e6edf3" font-size="11.5" font-family="Consolas, Menlo, monospace">$ minicom -b 115200 \</text>
  <text x="72" y="312" fill="#e6edf3" font-size="11.5" font-family="Consolas, Menlo, monospace"> &#160;&#160;&#160;-D /dev/ttyUSB0</text>

  <!-- Board -->
  <rect x="630" y="80" width="230" height="270" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="745" y="108" text-anchor="middle" fill="#d29922" font-size="16" font-weight="bold">Board</text>
  <text x="745" y="126" text-anchor="middle" fill="#8b949e" font-size="11">Jetson · Raspberry Pi · HummingBoard</text>
  <rect x="650" y="142" width="190" height="80" rx="6" fill="#21262d"/>
  <text x="745" y="168" text-anchor="middle" fill="#e6edf3" font-size="12">Ethernet / Wi-Fi</text>
  <text x="745" y="188" text-anchor="middle" fill="#8b949e" font-size="11">sshd listens on port 22</text>
  <text x="745" y="206" text-anchor="middle" fill="#8b949e" font-size="11">needs a running OS + network</text>
  <rect x="650" y="250" width="190" height="80" rx="6" fill="#21262d"/>
  <text x="745" y="276" text-anchor="middle" fill="#e6edf3" font-size="12">Debug UART pins (TX/RX/GND)</text>
  <text x="745" y="296" text-anchor="middle" fill="#8b949e" font-size="11">works from the first second of boot</text>
  <text x="745" y="314" text-anchor="middle" fill="#8b949e" font-size="11">even if network is broken</text>

  <!-- SSH path -->
  <path d="M250 182 H650" stroke="#2ea043" stroke-width="3" marker-end="url(#ag)"/>
  <text x="450" y="166" text-anchor="middle" fill="#2ea043" font-size="14" font-weight="bold">1 · SSH over the network (daily work)</text>
  <text x="450" y="204" text-anchor="middle" fill="#8b949e" font-size="11">encrypted shell · copy files with scp / rsync · VS Code Remote-SSH</text>

  <!-- Serial path -->
  <path d="M250 290 H650" stroke="#f0883e" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#ao)"/>
  <text x="450" y="274" text-anchor="middle" fill="#f0883e" font-size="14" font-weight="bold">2 · Serial console over USB-to-UART (rescue)</text>
  <text x="450" y="312" text-anchor="middle" fill="#8b949e" font-size="11">shows boot messages · 115200 baud, 8N1 · 3.3 V logic, never 5 V</text>

  <text x="450" y="378" text-anchor="middle" fill="#e6edf3" font-size="12">Find the board's address: run <tspan font-family="Consolas, Menlo, monospace" fill="#2ea043">hostname -I</tspan> on it, or check your router's list of clients.</text>
  <text x="450" y="400" text-anchor="middle" fill="#8b949e" font-size="12">Windows: ssh is built into PowerShell; for serial use PuTTY with COM3 (Device Manager shows the number).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
