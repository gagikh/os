<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="500" fill="#0d1117"/>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">What "Linux" is made of</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">Linux itself is only the kernel. A distribution packs the kernel together with everything above it.</text>

  <!-- Applications -->
  <rect x="60" y="72" width="560" height="62" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="80" y="94" fill="#2ea043" font-size="14" font-weight="bold">Applications</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#e6edf3">
    <rect x="80" y="104" width="70" height="22" rx="4" fill="#21262d"/><text x="115" y="119" text-anchor="middle">bash</text>
    <rect x="158" y="104" width="80" height="22" rx="4" fill="#21262d"/><text x="198" y="119" text-anchor="middle">python3</text>
    <rect x="246" y="104" width="70" height="22" rx="4" fill="#21262d"/><text x="281" y="119" text-anchor="middle">sshd</text>
    <rect x="324" y="104" width="70" height="22" rx="4" fill="#21262d"/><text x="359" y="119" text-anchor="middle">apt</text>
    <rect x="402" y="104" width="200" height="22" rx="4" fill="#2ea043" opacity="0.85"/><text x="502" y="119" text-anchor="middle">./hello &#160;(your program)</text>
  </g>

  <!-- Libraries -->
  <rect x="60" y="144" width="560" height="56" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="80" y="166" fill="#a371f7" font-size="14" font-weight="bold">System libraries</text>
  <text x="80" y="188" fill="#e6edf3" font-size="12" font-family="Consolas, Menlo, monospace">glibc (printf, open, read ...) &#160;&#160;libstdc++ &#160;&#160;libgpiod &#160;&#160;OpenCV</text>

  <!-- boundary -->
  <line x1="40" y1="222" x2="636" y2="222" stroke="#f0883e" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="620" y="216" text-anchor="end" fill="#f0883e" font-size="12" font-weight="bold">system calls: open, read, write, fork ...</text>
  <text x="40" y="214" fill="#8b949e" font-size="11">USER SPACE &#160;(programs cannot touch hardware)</text>
  <text x="40" y="238" fill="#8b949e" font-size="11">KERNEL SPACE &#160;(full access to hardware)</text>

  <!-- Kernel -->
  <rect x="60" y="248" width="560" height="96" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <text x="80" y="270" fill="#1f6feb" font-size="14" font-weight="bold">Linux kernel</text>
  <g font-size="12" fill="#e6edf3">
    <rect x="80" y="282" width="125" height="48" rx="5" fill="#1f6feb" opacity="0.3"/><text x="142" y="304" text-anchor="middle">Processes &amp;</text><text x="142" y="320" text-anchor="middle">scheduler</text>
    <rect x="213" y="282" width="125" height="48" rx="5" fill="#1f6feb" opacity="0.3"/><text x="275" y="304" text-anchor="middle">Memory</text><text x="275" y="320" text-anchor="middle">management</text>
    <rect x="346" y="282" width="125" height="48" rx="5" fill="#1f6feb" opacity="0.3"/><text x="408" y="304" text-anchor="middle">File systems</text><text x="408" y="320" text-anchor="middle">&amp; network</text>
    <rect x="479" y="282" width="125" height="48" rx="5" fill="#1f6feb" opacity="0.6"/><text x="541" y="304" text-anchor="middle">Device drivers</text><text x="541" y="320" text-anchor="middle">(Day 2, 3)</text>
  </g>

  <!-- Bootloader -->
  <rect x="60" y="354" width="560" height="34" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="80" y="376" fill="#8b949e" font-size="13" font-weight="bold">Bootloader / firmware</text>
  <text x="600" y="376" text-anchor="end" fill="#8b949e" font-size="12">loads the kernel at power-on (Day 2)</text>

  <!-- Hardware -->
  <rect x="60" y="398" width="560" height="62" rx="8" fill="#21262d" stroke="#d29922" stroke-width="2"/>
  <text x="80" y="420" fill="#d29922" font-size="14" font-weight="bold">Hardware (the board)</text>
  <text x="80" y="444" fill="#e6edf3" font-size="12">ARM CPU cores · RAM · SD / eMMC / NVMe · Ethernet, Wi-Fi · GPIO, I2C, SPI, UART · GPU / NPU</text>

  <!-- Distribution bracket -->
  <path d="M640 72 H662 V344 H640" fill="none" stroke="#e6edf3" stroke-width="1.5"/>
  <path d="M662 208 H684" fill="none" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="684" y="72" width="196" height="272" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="782" y="96" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">Distribution</text>
  <text x="782" y="114" text-anchor="middle" fill="#8b949e" font-size="11">kernel + libraries + apps</text>
  <text x="782" y="129" text-anchor="middle" fill="#8b949e" font-size="11">+ package manager</text>
  <g font-size="12">
    <text x="700" y="156" fill="#e6edf3">Jetson Orin / Nano</text><text x="712" y="173" fill="#2ea043">Ubuntu (NVIDIA L4T)</text>
    <text x="700" y="198" fill="#e6edf3">Raspberry Pi</text><text x="712" y="215" fill="#2ea043">Raspberry Pi OS (Debian)</text>
    <text x="700" y="240" fill="#e6edf3">i.MX8 HummingBoard</text><text x="712" y="257" fill="#2ea043">Debian, Ubuntu or Yocto</text>
    <text x="700" y="282" fill="#e6edf3">Your PC</text><text x="712" y="299" fill="#2ea043">Ubuntu / WSL2</text>
  </g>
  <text x="782" y="330" text-anchor="middle" fill="#8b949e" font-size="11" font-family="Consolas, Menlo, monospace">cat /etc/os-release</text>

  <text x="450" y="486" text-anchor="middle" fill="#8b949e" font-size="12">Every arrow from your program to the hardware goes through the kernel. That is why "reading a sensor" in Linux means asking the kernel for it.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
