<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xml:space="preserve" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="440" fill="#0d1117"/>
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f0883e"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Native build vs cross build</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">A compiled program contains machine code for one CPU family. x86_64 (PC) code does not run on aarch64 (board), and the reverse.</text>

  <!-- Native -->
  <rect x="30" y="72" width="840" height="120" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="50" y="96" fill="#d29922" font-size="15" font-weight="bold">1 · Native: everything happens on the board (aarch64)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="60" y="112" width="150" height="56" rx="6" fill="#21262d"/>
    <text x="135" y="136" fill="#e6edf3" font-family="Consolas, Menlo, monospace">hello.cpp</text>
    <text x="135" y="155" fill="#8b949e">source, plain text</text>
    <rect x="290" y="112" width="200" height="56" rx="6" fill="#21262d"/>
    <text x="390" y="136" fill="#e6edf3" font-family="Consolas, Menlo, monospace">g++ hello.cpp -o hello</text>
    <text x="390" y="155" fill="#8b949e">compiler on the board</text>
    <rect x="570" y="112" width="130" height="56" rx="6" fill="#d29922" opacity="0.85"/>
    <text x="635" y="136" fill="#0d1117" font-weight="bold" font-family="Consolas, Menlo, monospace">hello</text>
    <text x="635" y="155" fill="#0d1117">aarch64 binary</text>
    <text x="785" y="136" fill="#2ea043" font-family="Consolas, Menlo, monospace">./hello</text>
    <text x="785" y="155" fill="#8b949e">runs ✓</text>
  </g>
  <g stroke="#8b949e" stroke-width="2"><path d="M210 140 H286" marker-end="url(#aw)"/><path d="M490 140 H566" marker-end="url(#aw)"/><path d="M700 140 H736" marker-end="url(#aw)"/></g>
  <text x="450" y="184" text-anchor="middle" fill="#8b949e" font-size="11">Simple, always matches the board's libraries. Slow for big projects (OpenCV takes hours on a Pi).</text>

  <!-- Cross -->
  <rect x="30" y="208" width="840" height="170" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <text x="50" y="232" fill="#1f6feb" font-size="15" font-weight="bold">2 · Cross: compile on the PC (x86_64), run on the board (aarch64)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="60" y="248" width="150" height="56" rx="6" fill="#21262d"/>
    <text x="135" y="272" fill="#e6edf3" font-family="Consolas, Menlo, monospace">hello.cpp</text>
    <text x="135" y="291" fill="#8b949e">same source</text>
    <rect x="260" y="248" width="260" height="56" rx="6" fill="#21262d"/>
    <text x="390" y="272" fill="#e6edf3" font-family="Consolas, Menlo, monospace">aarch64-linux-gnu-g++ ...</text>
    <text x="390" y="291" fill="#8b949e">cross compiler: runs on x86, emits ARM</text>
    <rect x="570" y="248" width="130" height="56" rx="6" fill="#d29922" opacity="0.85"/>
    <text x="635" y="272" fill="#0d1117" font-weight="bold" font-family="Consolas, Menlo, monospace">hello</text>
    <text x="635" y="291" fill="#0d1117">aarch64 binary</text>
    <text x="785" y="268" fill="#f85149" font-family="Consolas, Menlo, monospace">./hello on PC</text>
    <text x="785" y="286" fill="#f85149">Exec format error ✗</text>
  </g>
  <g stroke="#8b949e" stroke-width="2"><path d="M210 276 H256" marker-end="url(#aw)"/><path d="M520 276 H566" marker-end="url(#aw)"/><path d="M700 276 H720" marker-end="url(#aw)"/></g>

  <path d="M635 304 V330 H560" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#ao)"/>
  <text x="640" y="350" fill="#f0883e" font-size="12" font-family="Consolas, Menlo, monospace">scp hello lab@board:~</text>
  <rect x="330" y="314" width="226" height="40" rx="6" fill="#21262d" stroke="#d29922"/>
  <text x="443" y="339" text-anchor="middle" fill="#2ea043" font-size="12" font-family="Consolas, Menlo, monospace">board$ ./hello &#160;&#160;runs ✓</text>
  <text x="60" y="339" fill="#8b949e" font-size="11">Fast, keeps the board free.</text>
  <text x="60" y="355" fill="#8b949e" font-size="11">Libraries must match the board.</text>
  <text x="450" y="372" text-anchor="middle" fill="#8b949e" font-size="11">Test without a board: &#160;qemu-aarch64 -L /usr/aarch64-linux-gnu ./hello</text>

  <text x="450" y="406" text-anchor="middle" fill="#e6edf3" font-size="12">Which one is it? <tspan font-family="Consolas, Menlo, monospace" fill="#2ea043">file hello</tspan> &#160;→ &#160;<tspan font-family="Consolas, Menlo, monospace" fill="#8b949e">ELF 64-bit LSB pie executable, ARM aarch64 ...</tspan></text>
  <text x="450" y="426" text-anchor="middle" fill="#8b949e" font-size="12">Python skips all of this: the board's own python3 reads hello.py and runs it. The same .py file works on every machine.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
