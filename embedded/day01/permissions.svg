<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xml:space="preserve" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="430" fill="#0d1117"/>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Reading one line of ls -l</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">Every file has an owner, a group, and three sets of rights: for the owner, for the group, for everybody else.</text>

  <!-- the ls line -->
  <rect x="60" y="72" width="780" height="46" rx="6" fill="#161b22" stroke="#30363d"/>
  <g font-family="Consolas, Menlo, monospace" font-size="22" font-weight="bold">
    <text x="88" y="103" fill="#8b949e">-</text>
    <text x="108" y="103" fill="#2ea043">rwx</text>
    <text x="158" y="103" fill="#1f6feb">r-x</text>
    <text x="208" y="103" fill="#f0883e">---</text>
    <text x="272" y="103" fill="#8b949e">1</text>
    <text x="302" y="103" fill="#2ea043">lab</text>
    <text x="358" y="103" fill="#1f6feb">dialout</text>
    <text x="466" y="103" fill="#8b949e">1832</text>
    <text x="530" y="103" fill="#8b949e">Nov 23 18:40</text>
    <text x="700" y="103" fill="#e6edf3">sysinfo.sh</text>
  </g>

  <!-- pointers -->
  <g stroke-width="1.5" fill="none">
    <path d="M95 118 V150" stroke="#8b949e"/>
    <path d="M128 118 V170" stroke="#2ea043"/>
    <path d="M178 118 V150" stroke="#1f6feb"/>
    <path d="M228 118 V170" stroke="#f0883e"/>
    <path d="M322 118 V150" stroke="#2ea043"/>
    <path d="M400 118 V150" stroke="#1f6feb"/>
    <path d="M492 118 V150" stroke="#8b949e"/>
    <path d="M766 118 V150" stroke="#e6edf3"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="95" y="166" fill="#8b949e">type</text>
    <text x="128" y="186" fill="#2ea043">owner</text>
    <text x="178" y="166" fill="#1f6feb">group</text>
    <text x="228" y="186" fill="#f0883e">others</text>
    <text x="322" y="166" fill="#2ea043">owner user</text>
    <text x="400" y="180" fill="#1f6feb">owner group</text>
    <text x="492" y="166" fill="#8b949e">size, bytes</text>
    <text x="766" y="166" fill="#e6edf3">name</text>
  </g>

  <text x="60" y="222" fill="#8b949e" font-size="12">type: &#160;- file &#160;&#160;d directory &#160;&#160;c character device &#160;&#160;l symbolic link</text>

  <!-- octal -->
  <rect x="60" y="262" width="430" height="140" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="80" y="286" fill="#e6edf3" font-size="14" font-weight="bold">Rights as numbers: r = 4, w = 2, x = 1</text>
  <g font-family="Consolas, Menlo, monospace" font-size="15">
    <text x="80" y="318" fill="#2ea043">r w x = 4+2+1 = 7</text>
    <text x="80" y="342" fill="#1f6feb">r - x = 4+0+1 = 5</text>
    <text x="80" y="366" fill="#f0883e">- - - = 0+0+0 = 0</text>
    <text x="262" y="342" fill="#e6edf3">→ &#160;chmod 750 sysinfo.sh</text>
  </g>
  <text x="80" y="392" fill="#8b949e" font-size="11">For a directory, x means "allowed to enter it" (cd).</text>

  <!-- groups for hardware -->
  <rect x="510" y="262" width="330" height="140" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="530" y="286" fill="#d29922" font-size="14" font-weight="bold">Why this matters on a board</text>
  <text x="530" y="308" fill="#e6edf3" font-size="12">Hardware is a file in /dev with a group:</text>
  <g font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#8b949e">
    <text x="530" y="330">crw-rw---- root dialout /dev/ttyUSB0</text>
    <text x="530" y="348">crw-rw---- root i2c &#160;&#160;&#160;&#160;/dev/i2c-1</text>
  </g>
  <text x="530" y="372" fill="#e6edf3" font-size="12">Join the group once, then log in again:</text>
  <text x="530" y="392" fill="#2ea043" font-size="12" font-family="Consolas, Menlo, monospace">sudo usermod -aG dialout,i2c $USER</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
