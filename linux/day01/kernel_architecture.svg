<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="440" fill="#0d1117"/>
  <defs>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f0883e"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Monolithic kernel vs microkernel</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">The question is simple: which parts of the OS run with full hardware access (kernel space), and which run as ordinary programs?</text>

  <!-- LEFT: Linux -->
  <text x="225" y="84" text-anchor="middle" fill="#2ea043" font-size="16" font-weight="bold">Monolithic: Linux</text>
  <rect x="30" y="96" width="390" height="58" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
  <text x="46" y="116" fill="#2ea043" font-size="12" font-weight="bold">User space</text>
  <g font-size="11.5" fill="#e6edf3" text-anchor="middle">
    <rect x="46" y="124" width="80" height="22" rx="4" fill="#21262d"/><text x="86" y="139">bash</text>
    <rect x="134" y="124" width="80" height="22" rx="4" fill="#21262d"/><text x="174" y="139">firefox</text>
    <rect x="222" y="124" width="80" height="22" rx="4" fill="#21262d"/><text x="262" y="139">./day01</text>
    <rect x="310" y="124" width="94" height="22" rx="4" fill="#21262d"/><text x="357" y="139">sshd</text>
  </g>
  <line x1="30" y1="166" x2="420" y2="166" stroke="#f0883e" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="225" y="182" text-anchor="middle" fill="#f0883e" font-size="11">system calls: open, read, write, fork, socket ...</text>
  <rect x="30" y="190" width="390" height="190" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <text x="46" y="210" fill="#1f6feb" font-size="12" font-weight="bold">Kernel space: one big program</text>
  <g font-size="11.5" fill="#e6edf3" text-anchor="middle">
    <rect x="46" y="220" width="174" height="36" rx="5" fill="#1f6feb" opacity="0.35"/><text x="133" y="243">Processes + scheduler</text>
    <rect x="230" y="220" width="174" height="36" rx="5" fill="#1f6feb" opacity="0.35"/><text x="317" y="243">Memory management</text>
    <rect x="46" y="264" width="174" height="36" rx="5" fill="#1f6feb" opacity="0.35"/><text x="133" y="287">VFS: ext4, FAT, /proc</text>
    <rect x="230" y="264" width="174" height="36" rx="5" fill="#1f6feb" opacity="0.35"/><text x="317" y="287">Network: TCP/IP</text>
    <rect x="46" y="308" width="174" height="36" rx="5" fill="#1f6feb" opacity="0.6"/><text x="133" y="331">Device drivers</text>
    <rect x="230" y="308" width="174" height="36" rx="5" fill="#0d1117" stroke="#2ea043" stroke-dasharray="5 3"/><text x="317" y="324" fill="#2ea043">Modules (.ko)</text><text x="317" y="338" fill="#8b949e" font-size="10.5">insmod / rmmod at runtime</text>
  </g>
  <text x="225" y="368" text-anchor="middle" fill="#8b949e" font-size="11">parts call each other directly, like C functions</text>
  <text x="225" y="404" text-anchor="middle" fill="#2ea043" font-size="12">+ fast: no messages between parts</text>
  <text x="225" y="422" text-anchor="middle" fill="#f85149" font-size="12">− one buggy driver can crash everything</text>

  <!-- RIGHT: microkernel -->
  <text x="675" y="84" text-anchor="middle" fill="#a371f7" font-size="16" font-weight="bold">Microkernel: MINIX 3, QNX, seL4</text>
  <rect x="480" y="96" width="390" height="210" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
  <text x="496" y="116" fill="#2ea043" font-size="12" font-weight="bold">User space</text>
  <g font-size="11.5" fill="#e6edf3" text-anchor="middle">
    <rect x="496" y="124" width="110" height="22" rx="4" fill="#21262d"/><text x="551" y="139">shell</text>
    <rect x="614" y="124" width="110" height="22" rx="4" fill="#21262d"/><text x="669" y="139">browser</text>
    <rect x="732" y="124" width="122" height="22" rx="4" fill="#21262d"/><text x="793" y="139">your program</text>
    <rect x="496" y="170" width="170" height="36" rx="5" fill="#a371f7" opacity="0.35"/><text x="581" y="193">File system server</text>
    <rect x="684" y="170" width="170" height="36" rx="5" fill="#a371f7" opacity="0.35"/><text x="769" y="193">Network server</text>
    <rect x="496" y="216" width="170" height="36" rx="5" fill="#a371f7" opacity="0.6"/><text x="581" y="239">Disk driver</text>
    <rect x="684" y="216" width="170" height="36" rx="5" fill="#a371f7" opacity="0.6"/><text x="769" y="239">Network driver</text>
  </g>
  <text x="675" y="276" text-anchor="middle" fill="#8b949e" font-size="11">drivers and file systems are ordinary processes;</text>
  <text x="675" y="291" text-anchor="middle" fill="#8b949e" font-size="11">a crashed driver is restarted, the system keeps running</text>
  <line x1="480" y1="318" x2="870" y2="318" stroke="#f0883e" stroke-width="2" stroke-dasharray="7 4"/>
  <rect x="560" y="328" width="230" height="52" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <text x="675" y="350" text-anchor="middle" fill="#1f6feb" font-size="12" font-weight="bold">Tiny kernel</text>
  <text x="675" y="368" text-anchor="middle" fill="#e6edf3" font-size="11">processes · memory · messages (IPC)</text>
  <path d="M520 252 V354 H554" stroke="#f0883e" stroke-width="1.5" fill="none" marker-end="url(#ao)"/>
  <path d="M830 252 V354 H796" stroke="#f0883e" stroke-width="1.5" fill="none" marker-end="url(#ao)"/>
  <text x="675" y="404" text-anchor="middle" fill="#2ea043" font-size="12">+ robust, small trusted code</text>
  <text x="675" y="422" text-anchor="middle" fill="#f85149" font-size="12">− every request becomes messages: slower</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
