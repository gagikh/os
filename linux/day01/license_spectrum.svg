<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="420" fill="#0d1117"/>
  <defs>
    <linearGradient id="spec" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2ea043"/><stop offset="0.5" stop-color="#d29922"/><stop offset="1" stop-color="#f85149"/>
    </linearGradient>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Open-source licenses: from "do anything" to "share alike"</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">All of them let you use, study and change the code. They differ in what you owe others when you distribute it.</text>

  <rect x="40" y="72" width="820" height="10" rx="5" fill="url(#spec)"/>
  <text x="40" y="100" fill="#2ea043" font-size="13" font-weight="bold">Permissive</text>
  <text x="450" y="100" text-anchor="middle" fill="#d29922" font-size="13" font-weight="bold">Weak copyleft</text>
  <text x="860" y="100" text-anchor="end" fill="#f85149" font-size="13" font-weight="bold">Strong copyleft</text>

  <g font-size="12" text-anchor="middle">
    <rect x="40" y="114" width="120" height="54" rx="6" fill="#161b22" stroke="#2ea043"/>
    <text x="100" y="136" fill="#e6edf3" font-weight="bold">MIT</text><text x="100" y="154" fill="#8b949e" font-size="10.5">short, popular</text>
    <rect x="172" y="114" width="120" height="54" rx="6" fill="#161b22" stroke="#2ea043"/>
    <text x="232" y="136" fill="#e6edf3" font-weight="bold">BSD-2 / BSD-3</text><text x="232" y="154" fill="#8b949e" font-size="10.5">FreeBSD, macOS parts</text>
    <rect x="304" y="114" width="120" height="54" rx="6" fill="#161b22" stroke="#2ea043"/>
    <text x="364" y="136" fill="#e6edf3" font-weight="bold">Apache-2.0</text><text x="364" y="154" fill="#8b949e" font-size="10.5">+ patent grant</text>
    <rect x="436" y="114" width="120" height="54" rx="6" fill="#161b22" stroke="#d29922"/>
    <text x="496" y="136" fill="#e6edf3" font-weight="bold">LGPL / MPL-2.0</text><text x="496" y="154" fill="#8b949e" font-size="10.5">glibc · Firefox</text>
    <rect x="568" y="114" width="90" height="54" rx="6" fill="#161b22" stroke="#f85149"/>
    <text x="613" y="136" fill="#e6edf3" font-weight="bold">GPL-2.0</text><text x="613" y="154" fill="#2ea043" font-size="10.5">Linux kernel</text>
    <rect x="670" y="114" width="90" height="54" rx="6" fill="#161b22" stroke="#f85149"/>
    <text x="715" y="136" fill="#e6edf3" font-weight="bold">GPL-3.0</text><text x="715" y="154" fill="#8b949e" font-size="10.5">bash, gcc</text>
    <rect x="772" y="114" width="88" height="54" rx="6" fill="#161b22" stroke="#f85149"/>
    <text x="816" y="136" fill="#e6edf3" font-weight="bold">AGPL-3.0</text><text x="816" y="154" fill="#8b949e" font-size="10.5">+ network use</text>
  </g>

  <!-- table -->
  <g font-size="12">
    <rect x="40" y="188" width="820" height="32" fill="#21262d"/>
    <text x="56" y="209" fill="#8b949e" font-weight="bold">If you ship a product with it ...</text>
    <text x="380" y="209" text-anchor="middle" fill="#2ea043" font-weight="bold">Permissive</text>
    <text x="560" y="209" text-anchor="middle" fill="#d29922" font-weight="bold">Weak copyleft</text>
    <text x="760" y="209" text-anchor="middle" fill="#f85149" font-weight="bold">Strong copyleft</text>

    <rect x="40" y="220" width="820" height="40" fill="#161b22"/>
    <text x="56" y="244" fill="#e6edf3">... may your own code stay closed?</text>
    <text x="380" y="244" text-anchor="middle" fill="#2ea043">yes</text>
    <text x="560" y="237" text-anchor="middle" fill="#d29922">yes, if you only link to it;</text>
    <text x="560" y="252" text-anchor="middle" fill="#d29922">not for changes to the library</text>
    <text x="760" y="244" text-anchor="middle" fill="#f85149">no: the whole work is GPL</text>

    <rect x="40" y="260" width="820" height="40" fill="#0d1117"/>
    <text x="56" y="284" fill="#e6edf3">... must you give out source code?</text>
    <text x="380" y="284" text-anchor="middle" fill="#2ea043">no</text>
    <text x="560" y="284" text-anchor="middle" fill="#d29922">the library + your changes</text>
    <text x="760" y="284" text-anchor="middle" fill="#f85149">all of it, to every user</text>

    <rect x="40" y="300" width="820" height="40" fill="#161b22"/>
    <text x="56" y="324" fill="#e6edf3">... what must you always keep?</text>
    <text x="380" y="324" text-anchor="middle" fill="#e6edf3">copyright + license text</text>
    <text x="560" y="324" text-anchor="middle" fill="#e6edf3">same + replaceable library</text>
    <text x="760" y="324" text-anchor="middle" fill="#e6edf3">same + same license</text>
  </g>

  <rect x="40" y="356" width="820" height="50" rx="8" fill="#161b22" stroke="#1f6feb"/>
  <text x="450" y="377" text-anchor="middle" fill="#1f6feb" font-size="12.5" font-weight="bold">Programs that only RUN on Linux (and call system calls) are not covered by the kernel's GPL.</text>
  <text x="450" y="395" text-anchor="middle" fill="#8b949e" font-size="12">GPL matters when you change the kernel, write a kernel module, or ship a device that contains Linux.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
