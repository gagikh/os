<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" fill="#0d1117"/>
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2ea043"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">What the shell does when you press Enter</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">The shell is an ordinary program running one loop, forever. Example input: <tspan font-family="Consolas, Menlo, monospace" fill="#e6edf3">ls -l $HOME</tspan></text>

  <g font-size="12">
    <!-- row 1 -->
    <rect x="30" y="80" width="190" height="86" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
    <text x="125" y="102" text-anchor="middle" fill="#2ea043" font-weight="bold">1 · Print prompt, read</text>
    <text x="125" y="124" text-anchor="middle" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11.5">student@ubuntu:~$</text>
    <text x="125" y="146" text-anchor="middle" fill="#8b949e">waits for a line + Enter</text>

    <rect x="250" y="80" width="190" height="86" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="345" y="102" text-anchor="middle" fill="#1f6feb" font-weight="bold">2 · Split into words</text>
    <text x="345" y="124" text-anchor="middle" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11.5">[ls] [-l] [$HOME]</text>
    <text x="345" y="146" text-anchor="middle" fill="#8b949e">spaces separate; quotes group</text>

    <rect x="470" y="80" width="190" height="86" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="565" y="102" text-anchor="middle" fill="#1f6feb" font-weight="bold">3 · Expand</text>
    <text x="565" y="124" text-anchor="middle" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11.5">$HOME → /home/student</text>
    <text x="565" y="146" text-anchor="middle" fill="#8b949e">variables, *, ~ (not in '...')</text>

    <rect x="690" y="80" width="180" height="86" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="780" y="102" text-anchor="middle" fill="#1f6feb" font-weight="bold">4 · Find the program</text>
    <text x="780" y="124" text-anchor="middle" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11.5">ls → /usr/bin/ls</text>
    <text x="780" y="146" text-anchor="middle" fill="#8b949e">searches $PATH (which ls)</text>

    <!-- row 2 -->
    <rect x="690" y="216" width="180" height="96" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="780" y="238" text-anchor="middle" fill="#d29922" font-weight="bold">5 · New process</text>
    <text x="780" y="260" text-anchor="middle" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11.5">fork() + exec()</text>
    <text x="780" y="280" text-anchor="middle" fill="#8b949e">child becomes /usr/bin/ls</text>
    <text x="780" y="298" text-anchor="middle" fill="#8b949e">with args -l /home/student</text>

    <rect x="470" y="216" width="190" height="96" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="565" y="238" text-anchor="middle" fill="#d29922" font-weight="bold">6 · Program runs</text>
    <text x="565" y="260" text-anchor="middle" fill="#8b949e">prints to the terminal;</text>
    <text x="565" y="280" text-anchor="middle" fill="#8b949e">the shell waits: wait()</text>
    <text x="565" y="298" text-anchor="middle" fill="#8b949e">(Ctrl+C stops the program)</text>

    <rect x="250" y="216" width="190" height="96" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <text x="345" y="238" text-anchor="middle" fill="#a371f7" font-weight="bold">7 · Exit status</text>
    <text x="345" y="260" text-anchor="middle" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11.5">echo $?  →  0</text>
    <text x="345" y="280" text-anchor="middle" fill="#8b949e">0 = success,</text>
    <text x="345" y="298" text-anchor="middle" fill="#8b949e">anything else = error</text>

    <rect x="30" y="216" width="190" height="96" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
    <text x="125" y="238" text-anchor="middle" fill="#2ea043" font-weight="bold">8 · Save in history</text>
    <text x="125" y="260" text-anchor="middle" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11.5">~/.bash_history</text>
    <text x="125" y="280" text-anchor="middle" fill="#8b949e">↑ and Ctrl+R find it</text>
    <text x="125" y="298" text-anchor="middle" fill="#8b949e">and go back to step 1</text>
  </g>

  <g stroke="#8b949e" stroke-width="2" fill="none">
    <path d="M220 123 H246" marker-end="url(#aw)"/><path d="M440 123 H466" marker-end="url(#aw)"/><path d="M660 123 H686" marker-end="url(#aw)"/>
    <path d="M780 166 V212" marker-end="url(#aw)"/>
    <path d="M690 264 H664" marker-end="url(#aw)"/><path d="M470 264 H444" marker-end="url(#aw)"/><path d="M250 264 H224" marker-end="url(#aw)"/>
  </g>
  <path d="M125 216 V170" stroke="#2ea043" stroke-width="2" fill="none" marker-end="url(#ag)"/>

  <text x="450" y="346" text-anchor="middle" fill="#e6edf3" font-size="12">Built-in commands (<tspan font-family="Consolas, Menlo, monospace" fill="#2ea043">cd</tspan>, <tspan font-family="Consolas, Menlo, monospace" fill="#2ea043">echo</tspan>, <tspan font-family="Consolas, Menlo, monospace" fill="#2ea043">history</tspan>) skip steps 4–6: the shell does them itself. Check with <tspan font-family="Consolas, Menlo, monospace" fill="#2ea043">type cd</tspan>.</text>
  <text x="450" y="370" text-anchor="middle" fill="#8b949e" font-size="12">Steps 5–7 are Day 10: you will write this loop yourself in C++ — a tiny shell.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
