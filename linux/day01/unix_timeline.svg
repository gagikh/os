<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" fill="#0d1117"/>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">From Unix to Linux: 55 years in one line</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">Above the line: the Unix and free-software ideas Linux inherited. Below: Linux itself and where it went.</text>

  <!-- axis: 1965..2030 mapped to x 40..860 : x = 40 + (year-1965)*12.615 -->
  <line x1="40" y1="200" x2="866" y2="200" stroke="#8b949e" stroke-width="2"/>
  <g fill="#8b949e" font-size="11" text-anchor="middle">
    <text x="103" y="218">1970</text><text x="229" y="218">1980</text><text x="355" y="218">1990</text>
    <text x="481" y="218">2000</text><text x="607" y="218">2010</text><text x="734" y="218">2020</text>
  </g>
  <g stroke="#30363d" stroke-width="1">
    <line x1="103" y1="196" x2="103" y2="204"/><line x1="229" y1="196" x2="229" y2="204"/><line x1="355" y1="196" x2="355" y2="204"/>
    <line x1="481" y1="196" x2="481" y2="204"/><line x1="607" y1="196" x2="607" y2="204"/><line x1="734" y1="196" x2="734" y2="204"/>
  </g>

  <!-- Above: heritage (blue = Unix/BSD, purple = GNU/standards) -->
  <g font-size="11.5">
    <line x1="91" y1="200" x2="91" y2="92" stroke="#1f6feb" stroke-width="1.5"/>
    <circle cx="91" cy="200" r="5" fill="#1f6feb"/>
    <text x="96" y="84" fill="#1f6feb" font-weight="bold">1969 Unix</text>
    <text x="96" y="98" fill="#8b949e">Bell Labs: Thompson, Ritchie</text>

    <line x1="141" y1="200" x2="141" y2="132" stroke="#1f6feb" stroke-width="1.5"/>
    <circle cx="141" cy="200" r="5" fill="#1f6feb"/>
    <text x="146" y="124" fill="#1f6feb" font-weight="bold">1973 Unix in C</text>
    <text x="146" y="138" fill="#8b949e">portable OS</text>

    <line x1="204" y1="200" x2="204" y2="166" stroke="#1f6feb" stroke-width="1.5"/>
    <circle cx="204" cy="200" r="5" fill="#1f6feb"/>
    <text x="199" y="164" text-anchor="end" fill="#1f6feb" font-weight="bold">1978 BSD</text>
    <text x="199" y="178" text-anchor="end" fill="#8b949e">→ FreeBSD, macOS</text>

    <line x1="267" y1="200" x2="267" y2="92" stroke="#a371f7" stroke-width="1.5"/>
    <circle cx="267" cy="200" r="5" fill="#a371f7"/>
    <text x="272" y="84" fill="#a371f7" font-weight="bold">1983 GNU</text>
    <text x="272" y="98" fill="#8b949e">Stallman: gcc, bash, libc</text>

    <line x1="317" y1="200" x2="317" y2="132" stroke="#1f6feb" stroke-width="1.5"/>
    <circle cx="317" cy="200" r="5" fill="#1f6feb"/>
    <text x="322" y="124" fill="#1f6feb" font-weight="bold">1987 MINIX</text>
    <text x="322" y="138" fill="#8b949e">Tanenbaum, for teaching</text>

    <line x1="330" y1="200" x2="330" y2="166" stroke="#a371f7" stroke-width="1.5"/>
    <circle cx="330" cy="200" r="5" fill="#a371f7"/>
    <text x="335" y="164" fill="#a371f7" font-weight="bold">1988 POSIX · 1989 GPL</text>
    <text x="335" y="178" fill="#8b949e">one interface · copyleft</text>

    <line x1="570" y1="200" x2="570" y2="132" stroke="#a371f7" stroke-width="1.5"/>
    <circle cx="570" cy="200" r="5" fill="#a371f7"/>
    <text x="575" y="124" fill="#a371f7" font-weight="bold">2007 GPL-3.0</text>
    <text x="575" y="138" fill="#8b949e">kernel stays GPL-2.0</text>
  </g>

  <!-- Below: Linux (green) -->
  <g font-size="11.5">
    <line x1="368" y1="200" x2="368" y2="240" stroke="#2ea043" stroke-width="1.5"/>
    <circle cx="368" cy="200" r="7" fill="#2ea043"/>
    <text x="363" y="238" text-anchor="end" fill="#2ea043" font-weight="bold" font-size="13">1991 Linux 0.01</text>
    <text x="363" y="252" text-anchor="end" fill="#8b949e">Linus Torvalds, a hobby for the 386</text>
    <line x1="393" y1="200" x2="393" y2="300" stroke="#2ea043" stroke-width="1.5"/>
    <circle cx="393" cy="200" r="5" fill="#2ea043"/>
    <text x="388" y="298" text-anchor="end" fill="#2ea043" font-weight="bold">1993 Debian, Slackware</text>
    <text x="388" y="312" text-anchor="end" fill="#8b949e">first distributions · 1994 Linux 1.0</text>
    <line x1="532" y1="200" x2="532" y2="340" stroke="#2ea043" stroke-width="1.5"/>
    <circle cx="532" cy="200" r="5" fill="#2ea043"/>
    <text x="537" y="338" text-anchor="start" fill="#2ea043" font-weight="bold">2004 Ubuntu</text>
    <text x="537" y="352" text-anchor="start" fill="#8b949e">2005 git, written for the kernel</text>
    <line x1="582" y1="200" x2="582" y2="290" stroke="#2ea043" stroke-width="1.5"/>
    <circle cx="582" cy="200" r="5" fill="#2ea043"/>
    <text x="587" y="288" text-anchor="start" fill="#2ea043" font-weight="bold">2008 Android</text>
    <text x="587" y="302" text-anchor="start" fill="#8b949e">Linux kernel, no GNU</text>
    <line x1="633" y1="200" x2="633" y2="234" stroke="#2ea043" stroke-width="1.5"/>
    <circle cx="633" cy="200" r="5" fill="#2ea043"/>
    <text x="638" y="232" text-anchor="start" fill="#2ea043" font-weight="bold">2012 Raspberry Pi</text>
    <text x="638" y="246" text-anchor="start" fill="#8b949e">a $35 Linux board</text>
    <line x1="759" y1="200" x2="759" y2="330" stroke="#2ea043" stroke-width="1.5"/>
    <circle cx="759" cy="200" r="5" fill="#2ea043"/>
    <text x="764" y="328" text-anchor="start" fill="#2ea043" font-weight="bold">2022 Rust</text>
    <text x="764" y="342" text-anchor="start" fill="#8b949e">in the kernel (6.1)</text>
    <line x1="784" y1="200" x2="784" y2="248" stroke="#2ea043" stroke-width="1.5"/>
    <circle cx="784" cy="200" r="5" fill="#2ea043"/>
    <text x="789" y="246" text-anchor="start" fill="#2ea043" font-weight="bold">2024 PREEMPT_RT</text>
    <text x="789" y="260" text-anchor="start" fill="#8b949e">in mainline (6.12)</text>
  </g>

  <text x="450" y="384" text-anchor="middle" fill="#8b949e" font-size="12">Linux kernel + GNU tools = a complete free Unix-like system. Linux is the kernel; Ubuntu, Debian, Android are what was built around it.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
