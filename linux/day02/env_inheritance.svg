<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="420" fill="#0d1117"/>
  <defs>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#a371f7"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f85149"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Environment variables flow down, never up</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">A new process gets a COPY of its parent's environment at the moment it starts. Shell-only variables are not copied.</text>

  <!-- shell -->
  <rect x="40" y="76" width="360" height="226" rx="10" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="60" y="100" fill="#2ea043" font-size="15" font-weight="bold">bash (parent)</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#e6edf3">
    <text x="60" y="128">$ x=10</text>
    <text x="60" y="148">$ export y=20</text>
    <text x="60" y="168">$ ./prog</text>
    <text x="60" y="270">$ echo $y</text>
    <text x="60" y="290" fill="#2ea043">20 &#160;&#160;&#160;&#160;&#160;← unchanged</text>
  </g>
  <rect x="226" y="112" width="156" height="64" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="304" y="130" text-anchor="middle" fill="#8b949e" font-size="11">shell variables</text>
  <text x="304" y="152" text-anchor="middle" fill="#e6edf3" font-size="12" font-family="Consolas, Menlo, monospace">x=10</text>
  <text x="304" y="168" text-anchor="middle" fill="#8b949e" font-size="10.5">stays here</text>
  <rect x="226" y="186" width="156" height="58" rx="6" fill="#a371f7" opacity="0.25" stroke="#a371f7"/>
  <text x="304" y="204" text-anchor="middle" fill="#a371f7" font-size="11">environment</text>
  <text x="304" y="226" text-anchor="middle" fill="#e6edf3" font-size="12" font-family="Consolas, Menlo, monospace">HOME=... y=20</text>

  <!-- child -->
  <rect x="500" y="76" width="360" height="226" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="520" y="100" fill="#d29922" font-size="15" font-weight="bold">./prog (child)</text>
  <rect x="520" y="186" width="156" height="58" rx="6" fill="#a371f7" opacity="0.25" stroke="#a371f7"/>
  <text x="598" y="204" text-anchor="middle" fill="#a371f7" font-size="11">environment (copy)</text>
  <text x="598" y="226" text-anchor="middle" fill="#e6edf3" font-size="12" font-family="Consolas, Menlo, monospace">HOME=... y=20</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#e6edf3">
    <text x="520" y="128">getenv("x") &#160;→ NULL</text>
    <text x="520" y="148">getenv("y") &#160;→ "20"</text>
    <text x="520" y="270">setenv("y", "99", 1);</text>
    <text x="520" y="290" fill="#8b949e">changes only its own copy</text>
  </g>

  <path d="M382 215 H516" stroke="#a371f7" stroke-width="2.5" fill="none" marker-end="url(#ap)"/>
  <text x="450" y="208" text-anchor="middle" fill="#a371f7" font-size="12" font-weight="bold">copied at start</text>
  <path d="M520 278 C 460 278, 460 290, 406 290" stroke="#f85149" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ar)"/>
  <text x="456" y="314" text-anchor="middle" fill="#f85149" font-size="12">✗ no way back</text>

  <!-- bottom rules -->
  <g font-size="12">
    <rect x="40" y="330" width="260" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="56" y="352" fill="#e6edf3" font-weight="bold">One command only</text>
    <text x="56" y="372" fill="#e6edf3" font-family="Consolas, Menlo, monospace">LANG=C ls /nothing</text>
    <text x="56" y="390" fill="#8b949e">LANG is set for ls, not for the shell</text>

    <rect x="320" y="330" width="260" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="336" y="352" fill="#e6edf3" font-weight="bold">Why cd and export are built-ins</text>
    <text x="336" y="372" fill="#8b949e">a separate program could only change</text>
    <text x="336" y="390" fill="#8b949e">its own copy, then exit</text>

    <rect x="600" y="330" width="260" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="616" y="352" fill="#e6edf3" font-weight="bold">Make it permanent</text>
    <text x="616" y="372" fill="#e6edf3" font-family="Consolas, Menlo, monospace">echo 'export y=20' &gt;&gt; ~/.bashrc</text>
    <text x="616" y="390" fill="#8b949e">every new shell runs ~/.bashrc</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
