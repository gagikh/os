<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="420" fill="#0d1117"/>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1f6feb"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#a371f7"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2ea043"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f85149"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f0883e"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">What a program receives, and what it gives back</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">Command typed in the shell: <tspan font-family="Consolas, Menlo, monospace" fill="#e6edf3">SERVER=lab ./day02 -v x+y &lt; in.txt</tspan></text>

  <!-- process -->
  <rect x="330" y="90" width="240" height="250" rx="12" fill="#161b22" stroke="#e6edf3" stroke-width="2"/>
  <text x="450" y="118" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">process ./day02</text>
  <text x="450" y="138" text-anchor="middle" fill="#8b949e" font-size="11" font-family="Consolas, Menlo, monospace">int main(int argc, char *argv[])</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="352" y="156" width="196" height="30" rx="5" fill="#1f6feb" opacity="0.3"/><text x="450" y="176" fill="#e6edf3">argv · argc = 3</text>
    <rect x="352" y="194" width="196" height="30" rx="5" fill="#a371f7" opacity="0.3"/><text x="450" y="214" fill="#e6edf3">environ · getenv()</text>
    <rect x="352" y="232" width="196" height="30" rx="5" fill="#21262d"/><text x="450" y="252" fill="#e6edf3">fd 0 · fd 1 · fd 2</text>
    <rect x="352" y="270" width="196" height="30" rx="5" fill="#f0883e" opacity="0.3"/><text x="450" y="290" fill="#e6edf3">return 0; / exit(3);</text>
  </g>
  <text x="450" y="326" text-anchor="middle" fill="#8b949e" font-size="11">all four are set up by the OS before main()</text>

  <!-- left inputs -->
  <g font-size="12">
    <rect x="20" y="90" width="270" height="76" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="34" y="111" fill="#1f6feb" font-weight="bold">1 · Argument list</text>
    <text x="34" y="132" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11.5">argv[0]="./day02" argv[1]="-v"</text>
    <text x="34" y="150" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11.5">argv[2]="x+y" &#160;&#160;&#160;&#160;argv[3]=NULL</text>
    <path d="M290 150 Q320 165 348 171" stroke="#1f6feb" stroke-width="2" fill="none" marker-end="url(#ab)"/>

    <rect x="20" y="182" width="270" height="76" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <text x="34" y="203" fill="#a371f7" font-weight="bold">2 · Environment (a copy of the shell's)</text>
    <text x="34" y="224" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11.5">"HOME=/home/student" "x=10"</text>
    <text x="34" y="242" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11.5">"SERVER=lab" ... NULL</text>
    <path d="M290 216 Q320 212 348 209" stroke="#a371f7" stroke-width="2" fill="none" marker-end="url(#ap)"/>

    <rect x="20" y="274" width="270" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
    <text x="34" y="295" fill="#2ea043" font-weight="bold">3a · stdin, fd 0</text>
    <text x="34" y="316" fill="#8b949e">keyboard, or a file with &lt; in.txt</text>
    <path d="M290 296 Q320 270 348 251" stroke="#2ea043" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  </g>

  <!-- right outputs -->
  <g font-size="12">
    <rect x="610" y="90" width="270" height="56" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
    <text x="624" y="111" fill="#2ea043" font-weight="bold">3b · stdout, fd 1: results</text>
    <text x="624" y="132" fill="#8b949e">terminal, or &gt; file, or | next program</text>
    <path d="M552 240 Q585 160 606 124" stroke="#2ea043" stroke-width="2" fill="none" marker-end="url(#ag)"/>

    <rect x="610" y="162" width="270" height="56" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="624" y="183" fill="#f85149" font-weight="bold">3c · stderr, fd 2: errors, messages</text>
    <text x="624" y="204" fill="#8b949e">terminal, or 2&gt; file; never buffered</text>
    <path d="M552 250 Q585 215 606 195" stroke="#f85149" stroke-width="2" fill="none" marker-end="url(#ar)"/>

    <rect x="610" y="244" width="270" height="86" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
    <text x="624" y="265" fill="#f0883e" font-weight="bold">4 · Exit status, 0–255</text>
    <text x="624" y="286" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11.5">$ echo $?</text>
    <text x="624" y="304" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11.5">0</text>
    <text x="624" y="322" fill="#8b949e">0 = success, else = error; used by &amp;&amp; ||</text>
    <path d="M552 285 H606" stroke="#f0883e" stroke-width="2" fill="none" marker-end="url(#ao)"/>
  </g>

  <text x="450" y="372" text-anchor="middle" fill="#e6edf3" font-size="12">The shell builds 1 and 2 before the program starts: it splits words, expands <tspan font-family="Consolas, Menlo, monospace" fill="#a371f7">$VAR</tspan> and <tspan font-family="Consolas, Menlo, monospace" fill="#1f6feb">*.txt</tspan>, and sets up redirections.</text>
  <text x="450" y="394" text-anchor="middle" fill="#8b949e" font-size="12">This is the whole interface of a Linux program with the world. Pipes, scripts and &amp;&amp; all build on these four.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
