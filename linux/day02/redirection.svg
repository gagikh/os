<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" fill="#0d1117"/>
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2ea043"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f85149"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Redirection rewires file descriptors, left to right</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12"><tspan font-family="Consolas, Menlo, monospace" fill="#e6edf3">2&gt;&amp;1</tspan> means: make fd 2 point to wherever fd 1 points RIGHT NOW. Order matters.</text>

  <!-- three columns -->
  <g font-size="12">
    <!-- col 1 -->
    <text x="150" y="88" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-family="Consolas, Menlo, monospace">ls / /nothing</text>
    <text x="150" y="106" text-anchor="middle" fill="#8b949e">default</text>
    <rect x="40" y="122" width="80" height="150" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="142" text-anchor="middle" fill="#8b949e" font-size="11">fd table</text>
    <g font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#e6edf3">
      <rect x="52" y="152" width="56" height="26" rx="4" fill="#21262d"/><text x="80" y="170">0</text>
      <rect x="52" y="188" width="56" height="26" rx="4" fill="#2ea043" opacity="0.5"/><text x="80" y="206">1</text>
      <rect x="52" y="224" width="56" height="26" rx="4" fill="#f85149" opacity="0.5"/><text x="80" y="242">2</text>
    </g>
    <rect x="180" y="170" width="100" height="62" rx="6" fill="#21262d" stroke="#8b949e"/>
    <text x="230" y="198" text-anchor="middle" fill="#e6edf3">terminal</text>
    <text x="230" y="216" text-anchor="middle" fill="#8b949e" font-size="11">/dev/pts/0</text>
    <path d="M108 165 C 140 165, 150 185, 176 188" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#aw)"/>
    <path d="M108 201 H176" stroke="#2ea043" stroke-width="2" fill="none" marker-end="url(#ag)"/>
    <path d="M108 237 C 140 237, 150 220, 176 216" stroke="#f85149" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <text x="150" y="300" text-anchor="middle" fill="#8b949e">listing and error both</text>
    <text x="150" y="316" text-anchor="middle" fill="#8b949e">appear on screen</text>

    <!-- col 2 -->
    <text x="450" y="88" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-family="Consolas, Menlo, monospace">... &gt; out.txt 2&gt;&amp;1</text>
    <text x="450" y="106" text-anchor="middle" fill="#8b949e">step 1: 1 → file · step 2: 2 → where 1 is (file)</text>
    <rect x="340" y="122" width="80" height="150" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="380" y="142" text-anchor="middle" fill="#8b949e" font-size="11">fd table</text>
    <g font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#e6edf3">
      <rect x="352" y="152" width="56" height="26" rx="4" fill="#21262d"/><text x="380" y="170">0</text>
      <rect x="352" y="188" width="56" height="26" rx="4" fill="#2ea043" opacity="0.5"/><text x="380" y="206">1</text>
      <rect x="352" y="224" width="56" height="26" rx="4" fill="#f85149" opacity="0.5"/><text x="380" y="242">2</text>
    </g>
    <rect x="480" y="130" width="100" height="40" rx="6" fill="#21262d" stroke="#8b949e"/>
    <text x="530" y="155" text-anchor="middle" fill="#e6edf3">terminal</text>
    <rect x="480" y="200" width="100" height="52" rx="6" fill="#d29922" opacity="0.85"/>
    <text x="530" y="224" text-anchor="middle" fill="#0d1117" font-weight="bold" font-family="Consolas, Menlo, monospace">out.txt</text>
    <text x="530" y="241" text-anchor="middle" fill="#0d1117" font-size="11">listing + error</text>
    <path d="M408 165 C 440 165, 450 152, 476 150" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#aw)"/>
    <path d="M408 201 C 440 201, 450 215, 476 218" stroke="#2ea043" stroke-width="2" fill="none" marker-end="url(#ag)"/>
    <path d="M408 237 C 440 237, 450 236, 476 236" stroke="#f85149" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <text x="450" y="300" text-anchor="middle" fill="#2ea043">✓ everything in the file</text>
    <text x="450" y="316" text-anchor="middle" fill="#8b949e">same as &amp;&gt; out.txt</text>

    <!-- col 3 -->
    <text x="750" y="88" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-family="Consolas, Menlo, monospace">... 2&gt;&amp;1 &gt; out.txt</text>
    <text x="750" y="106" text-anchor="middle" fill="#8b949e">step 1: 2 → where 1 is (terminal) · step 2: 1 → file</text>
    <rect x="640" y="122" width="80" height="150" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="680" y="142" text-anchor="middle" fill="#8b949e" font-size="11">fd table</text>
    <g font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#e6edf3">
      <rect x="652" y="152" width="56" height="26" rx="4" fill="#21262d"/><text x="680" y="170">0</text>
      <rect x="652" y="188" width="56" height="26" rx="4" fill="#2ea043" opacity="0.5"/><text x="680" y="206">1</text>
      <rect x="652" y="224" width="56" height="26" rx="4" fill="#f85149" opacity="0.5"/><text x="680" y="242">2</text>
    </g>
    <rect x="780" y="130" width="100" height="40" rx="6" fill="#21262d" stroke="#8b949e"/>
    <text x="830" y="148" text-anchor="middle" fill="#e6edf3">terminal</text>
    <text x="830" y="163" text-anchor="middle" fill="#f85149" font-size="11">error</text>
    <rect x="780" y="200" width="100" height="52" rx="6" fill="#d29922" opacity="0.85"/>
    <text x="830" y="224" text-anchor="middle" fill="#0d1117" font-weight="bold" font-family="Consolas, Menlo, monospace">out.txt</text>
    <text x="830" y="241" text-anchor="middle" fill="#0d1117" font-size="11">listing only</text>
    <path d="M708 165 C 740 165, 750 152, 776 150" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#aw)"/>
    <path d="M708 201 C 740 201, 750 215, 776 218" stroke="#2ea043" stroke-width="2" fill="none" marker-end="url(#ag)"/>
    <path d="M708 237 C 745 237, 740 170, 776 160" stroke="#f85149" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <text x="750" y="300" text-anchor="middle" fill="#f85149">✗ the error still on screen</text>
    <text x="750" y="316" text-anchor="middle" fill="#8b949e">2 copied fd 1 before it moved</text>
  </g>

  <line x1="300" y1="80" x2="300" y2="330" stroke="#30363d"/>
  <line x1="600" y1="80" x2="600" y2="330" stroke="#30363d"/>
  <text x="450" y="362" text-anchor="middle" fill="#e6edf3" font-size="12">With a pipe, 2&gt;&amp;1 goes before the |: &#160;<tspan font-family="Consolas, Menlo, monospace" fill="#2ea043">cmd 2&gt;&amp;1 | less</tspan> &#160;&#160;(the pipe is set up first, as fd 1)</text>
  <text x="450" y="384" text-anchor="middle" fill="#8b949e" font-size="12">A program never knows where its fd 1 leads: terminal, file or pipe. It just writes to fd 1.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
