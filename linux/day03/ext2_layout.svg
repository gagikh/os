<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" fill="#0d1117"/>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">ext2 on disk: a partition cut into block groups</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">Every group carries its own bitmaps, inode table and data, plus (in many groups) a backup of the superblock</text>

  <!-- partition bar -->
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="76" width="60" height="44" rx="4" fill="#21262d" stroke="#8b949e"/><text x="60" y="96" fill="#8b949e">boot</text><text x="60" y="111" fill="#8b949e" font-size="10">block</text>
    <rect x="94" y="76" width="200" height="44" rx="4" fill="#1f6feb" opacity="0.8"/><text x="194" y="103" fill="#e6edf3" font-weight="bold">Block group 0</text>
    <rect x="298" y="76" width="200" height="44" rx="4" fill="#1f6feb" opacity="0.45"/><text x="398" y="103" fill="#e6edf3">Block group 1</text>
    <rect x="502" y="76" width="200" height="44" rx="4" fill="#1f6feb" opacity="0.45"/><text x="602" y="103" fill="#e6edf3">Block group 2</text>
    <rect x="706" y="76" width="164" height="44" rx="4" fill="#1f6feb" opacity="0.25"/><text x="788" y="103" fill="#e6edf3">... group N</text>
  </g>
  <path d="M94 120 L30 160 M294 120 L870 160" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- expanded group -->
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="160" width="130" height="70" rx="5" fill="#d29922" opacity="0.85"/>
    <text x="95" y="190" fill="#0d1117" font-weight="bold">Superblock</text><text x="95" y="208" fill="#0d1117" font-size="11">(copy)</text>
    <rect x="164" y="160" width="130" height="70" rx="5" fill="#d29922" opacity="0.55"/>
    <text x="229" y="190" fill="#0d1117" font-weight="bold">Group</text><text x="229" y="206" fill="#0d1117" font-weight="bold">descriptors</text>
    <rect x="298" y="160" width="100" height="70" rx="5" fill="#a371f7" opacity="0.6"/>
    <text x="348" y="190" fill="#e6edf3" font-weight="bold">Block</text><text x="348" y="206" fill="#e6edf3" font-weight="bold">bitmap</text>
    <rect x="402" y="160" width="100" height="70" rx="5" fill="#a371f7" opacity="0.6"/>
    <text x="452" y="190" fill="#e6edf3" font-weight="bold">Inode</text><text x="452" y="206" fill="#e6edf3" font-weight="bold">bitmap</text>
    <rect x="506" y="160" width="140" height="70" rx="5" fill="#2ea043" opacity="0.6"/>
    <text x="576" y="190" fill="#e6edf3" font-weight="bold">Inode table</text><text x="576" y="208" fill="#e6edf3" font-size="11">inode 1, 2, 3 ...</text>
    <rect x="650" y="160" width="220" height="70" rx="5" fill="#21262d" stroke="#8b949e"/>
    <text x="760" y="190" fill="#e6edf3" font-weight="bold">Data blocks</text><text x="760" y="208" fill="#8b949e" font-size="11">file and directory contents</text>
  </g>

  <!-- explanations -->
  <g font-size="11.5">
    <rect x="30" y="246" width="264" height="134" rx="8" fill="#161b22" stroke="#d29922"/>
    <text x="44" y="266" fill="#d29922" font-weight="bold">Superblock: the file system's passport</text>
    <text x="44" y="286" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11">magic &#160;&#160;&#160;&#160;&#160;&#160;0xEF53</text>
    <text x="44" y="303" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11">block size &#160;1024 / 2048 / 4096</text>
    <text x="44" y="320" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11">blocks per group, inodes per group</text>
    <text x="44" y="337" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11">free blocks, free inodes</text>
    <text x="44" y="354" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11">mount count, max mount count</text>
    <text x="44" y="372" fill="#8b949e">only group 0's copy is read at mount</text>

    <rect x="298" y="246" width="204" height="134" rx="8" fill="#161b22" stroke="#a371f7"/>
    <text x="312" y="266" fill="#a371f7" font-weight="bold">Bitmaps: one bit per item</text>
    <text x="312" y="290" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="12">1 1 1 0 1 0 0 1 ...</text>
    <text x="312" y="312" fill="#8b949e">bit i = 1: block (inode) i used</text>
    <text x="312" y="330" fill="#8b949e">bit i = 0: free</text>
    <text x="312" y="352" fill="#8b949e">1 TB disk, 4 KB blocks:</text>
    <text x="312" y="370" fill="#8b949e">2²⁸ bits = 32 MB of bitmap</text>

    <rect x="506" y="246" width="364" height="134" rx="8" fill="#161b22" stroke="#2ea043"/>
    <text x="520" y="266" fill="#2ea043" font-weight="bold">Why groups?</text>
    <text x="520" y="288" fill="#e6edf3">ext2 tries to put a file's data in the same group</text>
    <text x="520" y="306" fill="#e6edf3">as its inode: short head movements, faster I/O.</text>
    <text x="520" y="330" fill="#e6edf3">A damaged superblock is not fatal:</text>
    <text x="520" y="348" fill="#2ea043" font-family="Consolas, Menlo, monospace" font-size="11">e2fsck -b 32768 /dev/sdb1</text>
    <text x="520" y="368" fill="#8b949e">uses the backup copy from group 1</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
