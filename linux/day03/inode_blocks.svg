<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="470" fill="#0d1117"/>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1f6feb"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f0883e"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#a371f7"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f85149"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">An ext2 inode: everything about a file except its name</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">15 block pointers: small files are reached directly, big files through 1, 2 or 3 levels of pointer blocks</text>

  <!-- inode -->
  <rect x="30" y="70" width="230" height="370" rx="10" fill="#161b22" stroke="#e6edf3" stroke-width="2"/>
  <text x="145" y="94" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">inode 1045</text>
  <g font-size="12" fill="#e6edf3">
    <rect x="44" y="104" width="202" height="104" rx="6" fill="#21262d"/>
    <text x="56" y="123">mode &#160;&#160;-rw-r--r-- (file)</text>
    <text x="56" y="141">owner &#160;student : student</text>
    <text x="56" y="159">size &#160;&#160;2 847 bytes</text>
    <text x="56" y="177">links &#160;1</text>
    <text x="56" y="195">atime · mtime · ctime</text>
  </g>
  <text x="145" y="226" text-anchor="middle" fill="#8b949e" font-size="11">no name here: names live in directories</text>
  <g font-size="12" font-family="Consolas, Menlo, monospace" fill="#e6edf3">
    <rect x="44" y="238" width="202" height="104" rx="6" fill="#1f6feb" opacity="0.3"/>
    <text x="56" y="258">direct[0] &#160;→ 8201</text>
    <text x="56" y="276">direct[1] &#160;→ 8202</text>
    <text x="56" y="294">...</text>
    <text x="56" y="312">direct[11] → 9330</text>
    <text x="56" y="332" fill="#8b949e" font-size="11">12 × 4 KB = 48 KB</text>
    <rect x="44" y="350" width="202" height="24" rx="5" fill="#f0883e" opacity="0.35"/><text x="56" y="367">single indirect</text>
    <rect x="44" y="380" width="202" height="24" rx="5" fill="#a371f7" opacity="0.35"/><text x="56" y="397">double indirect</text>
    <rect x="44" y="410" width="202" height="24" rx="5" fill="#f85149" opacity="0.35"/><text x="56" y="427">triple indirect</text>
  </g>

  <!-- direct data blocks -->
  <g font-size="11" text-anchor="middle" fill="#0d1117">
    <rect x="330" y="246" width="46" height="26" rx="3" fill="#1f6feb"/><text x="353" y="263" fill="#e6edf3">data</text>
    <rect x="382" y="246" width="46" height="26" rx="3" fill="#1f6feb"/><text x="405" y="263" fill="#e6edf3">data</text>
    <text x="448" y="264" fill="#8b949e">...</text>
    <rect x="466" y="246" width="46" height="26" rx="3" fill="#1f6feb"/><text x="489" y="263" fill="#e6edf3">data</text>
  </g>
  <path d="M246 270 C 290 270, 300 259, 326 259" stroke="#1f6feb" stroke-width="2" fill="none" marker-end="url(#ab)"/>

  <!-- single indirect -->
  <rect x="330" y="340" width="90" height="34" rx="5" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="375" y="354" text-anchor="middle" fill="#f0883e" font-size="10.5">1024 pointers</text>
  <text x="375" y="367" text-anchor="middle" fill="#8b949e" font-size="10">a 4 KB block</text>
  <path d="M246 362 H326" stroke="#f0883e" stroke-width="2" fill="none" marker-end="url(#ao)"/>
  <g fill="#1f6feb"><rect x="460" y="336" width="30" height="18" rx="2"/><rect x="494" y="336" width="30" height="18" rx="2"/><rect x="528" y="336" width="30" height="18" rx="2"/></g>
  <text x="575" y="350" fill="#8b949e" font-size="11">... 1024 data blocks</text>
  <path d="M420 352 H456" stroke="#f0883e" stroke-width="1.5" fill="none" marker-end="url(#ao)"/>

  <!-- double -->
  <rect x="330" y="384" width="90" height="26" rx="5" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="375" y="401" text-anchor="middle" fill="#a371f7" font-size="10.5">1024 pointers</text>
  <path d="M246 392 H326" stroke="#a371f7" stroke-width="2" fill="none" marker-end="url(#ap)"/>
  <rect x="460" y="384" width="90" height="26" rx="5" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="505" y="401" text-anchor="middle" fill="#f0883e" font-size="10.5">× 1024</text>
  <path d="M420 397 H456" stroke="#a371f7" stroke-width="1.5" fill="none" marker-end="url(#ap)"/>
  <text x="575" y="401" fill="#8b949e" font-size="11">→ 1024² data blocks</text>

  <!-- triple -->
  <rect x="330" y="416" width="90" height="26" rx="5" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="375" y="433" text-anchor="middle" fill="#f85149" font-size="10.5">1024 pointers</text>
  <path d="M246 422 H326" stroke="#f85149" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="440" y="433" fill="#8b949e" font-size="11">→ × 1024 → × 1024 → 1024³ data blocks</text>

  <!-- size table -->
  <rect x="610" y="76" width="260" height="214" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="740" y="98" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">Reach with 4 KB blocks</text>
  <g font-size="12">
    <text x="626" y="126" fill="#1f6feb">12 direct</text><text x="854" y="126" text-anchor="end" fill="#e6edf3">48 KB</text>
    <text x="626" y="152" fill="#f0883e">+ single: 1024 blocks</text><text x="854" y="152" text-anchor="end" fill="#e6edf3">4 MB</text>
    <text x="626" y="178" fill="#a371f7">+ double: 1024²</text><text x="854" y="178" text-anchor="end" fill="#e6edf3">4 GB</text>
    <text x="626" y="204" fill="#f85149">+ triple: 1024³</text><text x="854" y="204" text-anchor="end" fill="#e6edf3">4 TB</text>
    <line x1="626" y1="218" x2="854" y2="218" stroke="#30363d"/>
    <text x="626" y="240" fill="#8b949e">most files are small:</text>
    <text x="626" y="258" fill="#8b949e">they never leave the inode</text>
    <text x="626" y="278" fill="#8b949e">ext4 replaces this with extents</text>
  </g>
  <text x="740" y="312" text-anchor="middle" fill="#8b949e" font-size="11">1 pointer = 4 bytes, so a</text>
  <text x="740" y="328" text-anchor="middle" fill="#8b949e" font-size="11">4 KB block holds 1024 of them</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
