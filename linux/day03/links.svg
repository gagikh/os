<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" fill="#0d1117"/>
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2ea043"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#a371f7"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f85149"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Hard link vs symbolic link</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">A hard link is a second NAME for the same inode. A symlink is a separate small FILE that contains a path.</text>

  <!-- hard -->
  <text x="225" y="84" text-anchor="middle" fill="#2ea043" font-size="15" font-weight="bold">ln a.txt b.txt</text>
  <rect x="30" y="100" width="150" height="90" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="120" fill="#8b949e" font-size="11">directory entries</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#e6edf3">
    <rect x="40" y="130" width="130" height="22" rx="3" fill="#21262d"/><text x="48" y="146">a.txt → 1045</text>
    <rect x="40" y="158" width="130" height="22" rx="3" fill="#21262d"/><text x="48" y="174">b.txt → 1045</text>
  </g>
  <rect x="260" y="112" width="160" height="66" rx="6" fill="#2ea043" opacity="0.3" stroke="#2ea043"/>
  <text x="340" y="136" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-size="13">inode 1045</text>
  <text x="340" y="156" text-anchor="middle" fill="#e6edf3" font-size="12">links = 2</text>
  <text x="340" y="171" text-anchor="middle" fill="#8b949e" font-size="11">data: "hello"</text>
  <path d="M170 141 C 210 141, 220 135, 256 135" stroke="#2ea043" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <path d="M170 169 C 210 169, 220 157, 256 157" stroke="#2ea043" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <g font-size="12">
    <text x="30" y="218" fill="#e6edf3" font-family="Consolas, Menlo, monospace">rm a.txt</text>
    <text x="110" y="218" fill="#8b949e">→ links = 1, data stays, b.txt works</text>
    <text x="30" y="240" fill="#e6edf3" font-family="Consolas, Menlo, monospace">rm b.txt</text>
    <text x="110" y="240" fill="#8b949e">→ links = 0, blocks and inode freed</text>
    <text x="30" y="270" fill="#2ea043">✓ same file system only</text>
    <text x="30" y="290" fill="#2ea043">✓ regular files only (no directories)</text>
    <text x="30" y="310" fill="#8b949e">no "original": both names are equal</text>
  </g>

  <line x1="450" y1="72" x2="450" y2="330" stroke="#30363d"/>

  <!-- soft -->
  <text x="675" y="84" text-anchor="middle" fill="#a371f7" font-size="15" font-weight="bold">ln -s a.txt s.txt</text>
  <rect x="480" y="100" width="150" height="90" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="494" y="120" fill="#8b949e" font-size="11">directory entries</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#e6edf3">
    <rect x="490" y="130" width="130" height="22" rx="3" fill="#21262d"/><text x="498" y="146">a.txt → 1045</text>
    <rect x="490" y="158" width="130" height="22" rx="3" fill="#21262d"/><text x="498" y="174">s.txt → 2077</text>
  </g>
  <rect x="700" y="96" width="170" height="50" rx="6" fill="#2ea043" opacity="0.3" stroke="#2ea043"/>
  <text x="785" y="117" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-size="13">inode 1045</text>
  <text x="785" y="135" text-anchor="middle" fill="#8b949e" font-size="11">links = 1 · data "hello"</text>
  <rect x="700" y="162" width="170" height="54" rx="6" fill="#a371f7" opacity="0.3" stroke="#a371f7"/>
  <text x="785" y="183" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-size="13">inode 2077 (link)</text>
  <text x="785" y="203" text-anchor="middle" fill="#e6edf3" font-size="11" font-family="Consolas, Menlo, monospace">content: "a.txt"</text>
  <path d="M620 141 C 660 141, 670 121, 696 121" stroke="#2ea043" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <path d="M620 169 C 660 169, 670 189, 696 189" stroke="#a371f7" stroke-width="2" fill="none" marker-end="url(#ap)"/>
  <path d="M866 180 C 892 165, 892 150, 852 146" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#ap)"/>
  <text x="886" y="232" text-anchor="end" fill="#a371f7" font-size="11">follows the NAME, by path</text>
  <g font-size="12">
    <text x="480" y="260" fill="#e6edf3" font-family="Consolas, Menlo, monospace">rm a.txt</text>
    <text x="560" y="260" fill="#8b949e">→ s.txt dangles:</text>
    <text x="560" y="278" fill="#f85149">No such file or directory</text>
    <text x="480" y="302" fill="#a371f7">✓ any file system, directories too</text>
    <text x="480" y="322" fill="#8b949e">e.g. /bin → usr/bin, python3 → python3.12</text>
  </g>

  <text x="450" y="362" text-anchor="middle" fill="#e6edf3" font-size="12"><tspan font-family="Consolas, Menlo, monospace" fill="#2ea043">ls -li</tspan> shows both: the inode number in column 1, the link count after the permissions.</text>
  <text x="450" y="384" text-anchor="middle" fill="#8b949e" font-size="12">rm never "deletes a file": it calls unlink(), which removes one name and decrements the link count.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
