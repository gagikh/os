<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" fill="#0d1117"/>
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2ea043"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Finding /home/student/a.txt</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">A directory is a file of (inode number, name) entries. Each step: read an inode, then read its directory block.</text>

  <g font-size="12">
    <!-- columns: inode (top) + dir block (bottom) -->
    <!-- root -->
    <rect x="30" y="80" width="170" height="44" rx="6" fill="#2ea043" opacity="0.35" stroke="#2ea043"/>
    <text x="115" y="100" text-anchor="middle" fill="#e6edf3" font-weight="bold">inode 2 &#160;( / )</text>
    <text x="115" y="116" text-anchor="middle" fill="#8b949e" font-size="11">known: ext2 root is always 2</text>
    <rect x="30" y="150" width="170" height="120" rx="6" fill="#161b22" stroke="#30363d"/>
    <g font-family="Consolas, Menlo, monospace" font-size="11.5">
      <text x="44" y="172" fill="#8b949e">2 &#160;&#160;&#160;.</text>
      <text x="44" y="192" fill="#8b949e">2 &#160;&#160;&#160;..</text>
      <text x="44" y="212" fill="#8b949e">12 &#160;&#160;etc</text>
      <rect x="38" y="220" width="154" height="20" rx="3" fill="#d29922" opacity="0.4"/>
      <text x="44" y="234" fill="#e6edf3">131 &#160;home</text>
      <text x="44" y="256" fill="#8b949e">17 &#160;&#160;usr</text>
    </g>

    <rect x="250" y="80" width="170" height="44" rx="6" fill="#2ea043" opacity="0.35" stroke="#2ea043"/>
    <text x="335" y="100" text-anchor="middle" fill="#e6edf3" font-weight="bold">inode 131 &#160;( home )</text>
    <text x="335" y="116" text-anchor="middle" fill="#8b949e" font-size="11">type: directory</text>
    <rect x="250" y="150" width="170" height="120" rx="6" fill="#161b22" stroke="#30363d"/>
    <g font-family="Consolas, Menlo, monospace" font-size="11.5">
      <text x="264" y="172" fill="#8b949e">131 &#160;.</text>
      <text x="264" y="192" fill="#8b949e">2 &#160;&#160;&#160;..</text>
      <rect x="258" y="200" width="154" height="20" rx="3" fill="#d29922" opacity="0.4"/>
      <text x="264" y="214" fill="#e6edf3">262 &#160;student</text>
      <text x="264" y="236" fill="#8b949e">270 &#160;guest</text>
    </g>

    <rect x="470" y="80" width="170" height="44" rx="6" fill="#2ea043" opacity="0.35" stroke="#2ea043"/>
    <text x="555" y="100" text-anchor="middle" fill="#e6edf3" font-weight="bold">inode 262 &#160;( student )</text>
    <text x="555" y="116" text-anchor="middle" fill="#8b949e" font-size="11">type: directory</text>
    <rect x="470" y="150" width="170" height="120" rx="6" fill="#161b22" stroke="#30363d"/>
    <g font-family="Consolas, Menlo, monospace" font-size="11.5">
      <text x="484" y="172" fill="#8b949e">262 &#160;.</text>
      <text x="484" y="192" fill="#8b949e">131 &#160;..</text>
      <text x="484" y="212" fill="#8b949e">300 &#160;.bashrc</text>
      <rect x="478" y="220" width="154" height="20" rx="3" fill="#d29922" opacity="0.4"/>
      <text x="484" y="234" fill="#e6edf3">1045 a.txt</text>
    </g>

    <rect x="690" y="80" width="180" height="44" rx="6" fill="#1f6feb" opacity="0.4" stroke="#1f6feb"/>
    <text x="780" y="100" text-anchor="middle" fill="#e6edf3" font-weight="bold">inode 1045 &#160;( a.txt )</text>
    <text x="780" y="116" text-anchor="middle" fill="#8b949e" font-size="11">type: regular file</text>
    <rect x="690" y="150" width="180" height="120" rx="6" fill="#161b22" stroke="#30363d"/>
    <g font-size="11.5" fill="#e6edf3">
      <text x="704" y="172">direct[0] → block 8201</text>
      <text x="704" y="192">direct[1] → block 8202</text>
      <text x="704" y="222" fill="#8b949e">the file's data:</text>
      <rect x="704" y="232" width="70" height="24" rx="3" fill="#1f6feb"/><rect x="782" y="232" width="70" height="24" rx="3" fill="#1f6feb"/>
    </g>
  </g>

  <g stroke-width="2" fill="none">
    <path d="M115 124 V146" stroke="#8b949e" marker-end="url(#aw)"/>
    <path d="M335 124 V146" stroke="#8b949e" marker-end="url(#aw)"/>
    <path d="M555 124 V146" stroke="#8b949e" marker-end="url(#aw)"/>
    <path d="M780 124 V146" stroke="#8b949e" marker-end="url(#aw)"/>
    <path d="M192 230 C 225 230, 220 102, 246 102" stroke="#d29922" marker-end="url(#ag)"/>
    <path d="M412 210 C 445 210, 440 102, 466 102" stroke="#d29922" marker-end="url(#ag)"/>
    <path d="M632 230 C 665 230, 660 102, 686 102" stroke="#d29922" marker-end="url(#ag)"/>
  </g>

  <g font-size="12">
    <text x="450" y="304" text-anchor="middle" fill="#e6edf3">4 inodes + 4 directory blocks read before the first byte of a.txt: that is why the kernel keeps a <tspan fill="#2ea043">dentry cache</tspan>,</text>
    <text x="450" y="324" text-anchor="middle" fill="#e6edf3">and why relative paths start from the current directory instead of from /.</text>
    <text x="450" y="354" text-anchor="middle" fill="#8b949e">See it yourself: &#160;<tspan font-family="Consolas, Menlo, monospace" fill="#2ea043">ls -ia /</tspan> &#160;· &#160;<tspan font-family="Consolas, Menlo, monospace" fill="#2ea043">ls -id /home ~</tspan> &#160;· &#160;<tspan font-family="Consolas, Menlo, monospace" fill="#2ea043">stat ~/a.txt</tspan></text>
    <text x="450" y="378" text-anchor="middle" fill="#8b949e">Note how ".." in /home points back to 2: that is how cd .. works.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
