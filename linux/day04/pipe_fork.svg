<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="470" fill="#0d1117"/>
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2ea043"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">pipe() + fork(): close the end you do not use</text>

  <!-- left: after fork -->
  <text x="225" y="64" text-anchor="middle" fill="#8b949e" font-size="13">Right after fork: both processes hold both ends</text>
  <rect x="30" y="80" width="130" height="110" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <text x="95" y="102" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-size="13">parent</text>
  <text x="95" y="132" text-anchor="middle" fill="#e6edf3" font-family="Consolas, monospace" font-size="12">fds[0] read</text>
  <text x="95" y="162" text-anchor="middle" fill="#e6edf3" font-family="Consolas, monospace" font-size="12">fds[1] write</text>
  <rect x="290" y="80" width="130" height="110" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="355" y="102" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-size="13">child</text>
  <text x="355" y="132" text-anchor="middle" fill="#e6edf3" font-family="Consolas, monospace" font-size="12">fds[0] read</text>
  <text x="355" y="162" text-anchor="middle" fill="#e6edf3" font-family="Consolas, monospace" font-size="12">fds[1] write</text>
  <rect x="180" y="205" width="90" height="34" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
  <text x="225" y="227" text-anchor="middle" fill="#d29922" font-size="12">kernel buffer</text>
  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <path d="M110 190 L195 205"/><path d="M140 190 L205 205"/>
    <path d="M340 190 L255 205"/><path d="M310 190 L245 205"/>
  </g>
  <text x="225" y="262" text-anchor="middle" fill="#f85149" font-size="12">4 descriptors point to one pipe</text>

  <!-- right: after closing -->
  <text x="675" y="64" text-anchor="middle" fill="#8b949e" font-size="13">After closing: one channel, child → parent</text>
  <rect x="480" y="80" width="130" height="110" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="545" y="102" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-size="13">child</text>
  <text x="545" y="132" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="12">close(fds[0])</text>
  <text x="545" y="162" text-anchor="middle" fill="#2ea043" font-family="Consolas, monospace" font-size="12">write(fds[1])</text>
  <rect x="740" y="80" width="130" height="110" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <text x="805" y="102" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-size="13">parent</text>
  <text x="805" y="132" text-anchor="middle" fill="#1f6feb" font-family="Consolas, monospace" font-size="12">read(fds[0])</text>
  <text x="805" y="162" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="12">close(fds[1])</text>
  <rect x="630" y="205" width="90" height="34" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
  <text x="675" y="227" text-anchor="middle" fill="#d29922" font-size="12">kernel buffer</text>
  <path d="M580 190 L640 205" stroke="#2ea043" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <path d="M720 210 L770 190" stroke="#2ea043" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <text x="675" y="262" text-anchor="middle" fill="#2ea043" font-size="12">child exits → no writers left → parent's read returns 0</text>

  <!-- rules table -->
  <rect x="30" y="286" width="840" height="168" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="312" fill="#e6edf3" font-size="14" font-weight="bold">The rules</text>
  <g font-size="12">
    <text x="50" y="340" fill="#1f6feb" font-family="Consolas, monospace">read</text><text x="110" y="340" fill="#e6edf3">empty pipe, a writer still open</text><text x="460" y="340" fill="#d29922">waits (sleeps)</text>
    <text x="50" y="364" fill="#1f6feb" font-family="Consolas, monospace">read</text><text x="110" y="364" fill="#e6edf3">empty pipe, all write ends closed</text><text x="460" y="364" fill="#2ea043">returns 0 = EOF</text>
    <text x="50" y="388" fill="#2ea043" font-family="Consolas, monospace">write</text><text x="110" y="388" fill="#e6edf3">buffer full (16 pages = 64 KiB)</text><text x="460" y="388" fill="#d29922">waits until the reader takes data</text>
    <text x="50" y="412" fill="#2ea043" font-family="Consolas, monospace">write</text><text x="110" y="412" fill="#e6edf3">all read ends closed</text><text x="460" y="412" fill="#f85149">SIGPIPE, or -1 with errno = EPIPE</text>
    <text x="50" y="438" fill="#8b949e">Forget close(fds[1]) in the parent and the parent itself is "a writer still open": its read waits forever.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
