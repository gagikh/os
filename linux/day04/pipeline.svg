<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" fill="#0d1117"/>
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2ea043"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f85149"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">ls -l /etc | grep conf | wc -l</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">Three processes running at the same time, joined by two kernel buffers. None of them knows it is in a pipeline.</text>

  <!-- processes -->
  <g font-size="12">
    <rect x="30" y="90" width="170" height="110" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
    <text x="115" y="116" text-anchor="middle" fill="#1f6feb" font-size="15" font-weight="bold" font-family="Consolas, Menlo, monospace">ls -l /etc</text>
    <text x="115" y="138" text-anchor="middle" fill="#8b949e">writes lines to fd 1</text>
    <text x="115" y="160" text-anchor="middle" fill="#8b949e">PID 4101</text>

    <rect x="365" y="90" width="170" height="110" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
    <text x="450" y="116" text-anchor="middle" fill="#1f6feb" font-size="15" font-weight="bold" font-family="Consolas, Menlo, monospace">grep conf</text>
    <text x="450" y="138" text-anchor="middle" fill="#8b949e">reads fd 0, filters,</text>
    <text x="450" y="156" text-anchor="middle" fill="#8b949e">writes fd 1</text>
    <text x="450" y="176" text-anchor="middle" fill="#8b949e">PID 4102</text>

    <rect x="700" y="90" width="170" height="110" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
    <text x="785" y="116" text-anchor="middle" fill="#1f6feb" font-size="15" font-weight="bold" font-family="Consolas, Menlo, monospace">wc -l</text>
    <text x="785" y="138" text-anchor="middle" fill="#8b949e">reads fd 0 until EOF,</text>
    <text x="785" y="156" text-anchor="middle" fill="#8b949e">then prints the count</text>
    <text x="785" y="176" text-anchor="middle" fill="#8b949e">PID 4103</text>
  </g>

  <!-- pipes -->
  <g font-size="11">
    <rect x="220" y="122" width="125" height="46" rx="6" fill="#d29922" opacity="0.8"/>
    <text x="282" y="141" text-anchor="middle" fill="#0d1117" font-weight="bold">pipe buffer</text>
    <text x="282" y="157" text-anchor="middle" fill="#0d1117">in the kernel, 64 KB</text>
    <rect x="555" y="122" width="125" height="46" rx="6" fill="#d29922" opacity="0.8"/>
    <text x="617" y="141" text-anchor="middle" fill="#0d1117" font-weight="bold">pipe buffer</text>
    <text x="617" y="157" text-anchor="middle" fill="#0d1117">in the kernel, 64 KB</text>
  </g>
  <g stroke="#2ea043" stroke-width="2.5" fill="none">
    <path d="M200 145 H216" marker-end="url(#ag)"/><path d="M345 145 H361" marker-end="url(#ag)"/>
    <path d="M535 145 H551" marker-end="url(#ag)"/><path d="M680 145 H696" marker-end="url(#ag)"/>
  </g>
  <g font-size="10.5" fill="#2ea043" text-anchor="middle">
    <text x="208" y="112">fd 1</text><text x="353" y="112">fd 0</text><text x="543" y="112">fd 1</text><text x="688" y="112">fd 0</text>
  </g>

  <!-- stderr -->
  <g stroke="#f85149" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <path d="M115 200 V246 H420" marker-end="url(#ar)"/>
    <path d="M450 200 V232" marker-end="url(#ar)"/>
  </g>
  <rect x="424" y="234" width="210" height="34" rx="6" fill="#21262d" stroke="#8b949e"/>
  <text x="529" y="256" text-anchor="middle" fill="#e6edf3" font-size="12">terminal</text>
  <path d="M785 200 V251 H638" stroke="#2ea043" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <text x="250" y="240" fill="#f85149" font-size="11">fd 2 (errors) skip the pipe</text>
  <text x="790" y="232" fill="#2ea043" font-size="11">fd 1: "42"</text>

  <!-- rules -->
  <g font-size="12">
    <rect x="30" y="292" width="270" height="88" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="44" y="314" fill="#e6edf3" font-weight="bold">Buffer full</text>
    <text x="44" y="334" fill="#8b949e">the writer sleeps until the reader</text>
    <text x="44" y="352" fill="#8b949e">takes data out: a fast producer is</text>
    <text x="44" y="370" fill="#8b949e">slowed to the consumer's speed</text>

    <rect x="315" y="292" width="270" height="88" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="329" y="314" fill="#e6edf3" font-weight="bold">Writer exits</text>
    <text x="329" y="334" fill="#8b949e">the reader drains the buffer, then</text>
    <text x="329" y="352" fill="#8b949e">read() returns 0: EOF. That is how</text>
    <text x="329" y="370" fill="#8b949e">wc knows it can print the count</text>

    <rect x="600" y="292" width="270" height="88" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="614" y="314" fill="#e6edf3" font-weight="bold">Reader exits first</text>
    <text x="614" y="334" fill="#8b949e">the next write gets SIGPIPE and the</text>
    <text x="614" y="352" fill="#8b949e">writer dies: that is why</text>
    <text x="614" y="370" fill="#2ea043" font-family="Consolas, Menlo, monospace">yes | head -3</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
