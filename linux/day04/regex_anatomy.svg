<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" fill="#0d1117"/>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Reading a regular expression piece by piece</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">An IPv4-looking line, in extended syntax: &#160;<tspan font-family="Consolas, Menlo, monospace" fill="#e6edf3">grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}$'</tspan></text>

  <!-- the pattern, big -->
  <g font-family="Consolas, Menlo, monospace" font-size="30" font-weight="bold" text-anchor="middle">
    <text x="118" y="122" fill="#f0883e">^</text>
    <text x="148" y="122" fill="#a371f7">(</text>
    <text x="222" y="122" fill="#1f6feb">[0-9]</text>
    <text x="320" y="122" fill="#2ea043">{1,3}</text>
    <text x="400" y="122" fill="#d29922">\.</text>
    <text x="436" y="122" fill="#a371f7">)</text>
    <text x="482" y="122" fill="#2ea043">{3}</text>
    <text x="580" y="122" fill="#1f6feb">[0-9]</text>
    <text x="678" y="122" fill="#2ea043">{1,3}</text>
    <text x="742" y="122" fill="#f0883e">$</text>
  </g>

  <!-- brackets / labels -->
  <g stroke-width="1.5" fill="none">
    <path d="M118 132 V160" stroke="#f0883e"/>
    <path d="M182 132 V150 H262 V132" stroke="#1f6feb"/>
    <path d="M284 132 V150 H356 V132" stroke="#2ea043"/>
    <path d="M384 132 V150 H416 V132" stroke="#d29922"/>
    <path d="M140 136 V196 H444 V136" stroke="#a371f7" stroke-dasharray="5 3"/>
    <path d="M462 132 V160" stroke="#2ea043"/>
    <path d="M540 132 V150 H620 V132" stroke="#1f6feb"/>
    <path d="M642 132 V150 H714 V132" stroke="#2ea043"/>
    <path d="M742 132 V160" stroke="#f0883e"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="118" y="176" fill="#f0883e">line start</text>
    <text x="222" y="168" fill="#1f6feb">one digit</text>
    <text x="320" y="168" fill="#2ea043">1 to 3 times</text>
    <text x="400" y="168" fill="#d29922">a real dot</text>
    <text x="292" y="214" fill="#a371f7">group: "1 to 3 digits, then a dot", e.g. "192."</text>
    <text x="482" y="176" fill="#2ea043">group × 3</text>
    <text x="630" y="168" fill="#1f6feb">last number: 1 to 3 digits</text>
    <text x="742" y="176" fill="#f0883e">line end</text>
  </g>

  <!-- matches -->
  <g font-size="13" font-family="Consolas, Menlo, monospace">
    <rect x="60" y="240" width="370" height="122" rx="8" fill="#161b22" stroke="#2ea043"/>
    <text x="76" y="262" fill="#2ea043" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="12">matches</text>
    <text x="76" y="286" fill="#e6edf3">192.168.1.10</text>
    <text x="76" y="308" fill="#e6edf3">10.0.0.1</text>
    <text x="76" y="330" fill="#e6edf3">999.999.999.999</text><text x="240" y="330" fill="#d29922" font-family="Helvetica, Arial, sans-serif" font-size="11">← shape is right, value is not!</text>
    <text x="76" y="352" fill="#8b949e" font-family="Helvetica, Arial, sans-serif" font-size="11">a regex checks the form of text, not its meaning</text>

    <rect x="470" y="240" width="370" height="122" rx="8" fill="#161b22" stroke="#f85149"/>
    <text x="486" y="262" fill="#f85149" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="12">does not match</text>
    <text x="486" y="286" fill="#e6edf3">1.2.3</text><text x="620" y="286" fill="#8b949e" font-family="Helvetica, Arial, sans-serif" font-size="11">only 2 groups</text>
    <text x="486" y="308" fill="#e6edf3">1.2.3.4.5</text><text x="620" y="308" fill="#8b949e" font-family="Helvetica, Arial, sans-serif" font-size="11">$ needs the end here</text>
    <text x="486" y="330" fill="#e6edf3">ip=1.2.3.4</text><text x="620" y="330" fill="#8b949e" font-family="Helvetica, Arial, sans-serif" font-size="11">^ needs a digit first</text>
    <text x="486" y="352" fill="#e6edf3">1a2.3.4.5</text><text x="620" y="352" fill="#8b949e" font-family="Helvetica, Arial, sans-serif" font-size="11">a is not [0-9]</text>
  </g>

  <text x="450" y="388" text-anchor="middle" fill="#8b949e" font-size="12">Without -E (basic syntax) the same pattern needs backslashes: <tspan font-family="Consolas, Menlo, monospace" fill="#e6edf3">^\([0-9]\{1,3\}\.\)\{3\}[0-9]\{1,3\}$</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
