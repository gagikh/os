<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" fill="#0d1117"/>
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Archive, then compress: two tools, two jobs</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">tar keeps the structure (names, folders, permissions, times). gzip/xz/zstd make one stream of bytes smaller.</text>

  <!-- files -->
  <g font-size="11" font-family="Consolas, Menlo, monospace" fill="#e6edf3">
    <rect x="30" y="80" width="150" height="130" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="44" y="100" fill="#8b949e" font-family="Helvetica, Arial, sans-serif">project/</text>
    <text x="54" y="122">main.cpp &#160;&#160;12 KB</text>
    <text x="54" y="142">util.cpp &#160;&#160;&#160;8 KB</text>
    <text x="54" y="162">util.h &#160;&#160;&#160;&#160;&#160;2 KB</text>
    <text x="54" y="182">README.md &#160;&#160;4 KB</text>
    <text x="44" y="202" fill="#8b949e" font-family="Helvetica, Arial, sans-serif">4 files, 26 KB</text>
  </g>

  <rect x="230" y="110" width="90" height="70" rx="8" fill="#1f6feb" opacity="0.85"/>
  <text x="275" y="140" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-family="Consolas, Menlo, monospace">tar -c</text>
  <text x="275" y="160" text-anchor="middle" fill="#e6edf3" font-size="11">archive</text>

  <rect x="370" y="105" width="150" height="80" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="445" y="132" text-anchor="middle" fill="#e6edf3" font-family="Consolas, Menlo, monospace">project.tar</text>
  <text x="445" y="152" text-anchor="middle" fill="#8b949e" font-size="11">one file, ~30 KB</text>
  <text x="445" y="170" text-anchor="middle" fill="#8b949e" font-size="11">headers + data, NOT smaller</text>

  <rect x="570" y="110" width="90" height="70" rx="8" fill="#2ea043" opacity="0.85"/>
  <text x="615" y="140" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-family="Consolas, Menlo, monospace">gzip</text>
  <text x="615" y="160" text-anchor="middle" fill="#e6edf3" font-size="11">compress</text>

  <rect x="710" y="105" width="160" height="80" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
  <text x="790" y="132" text-anchor="middle" fill="#e6edf3" font-family="Consolas, Menlo, monospace">project.tar.gz</text>
  <text x="790" y="152" text-anchor="middle" fill="#2ea043" font-size="11">~8 KB</text>
  <text x="790" y="170" text-anchor="middle" fill="#8b949e" font-size="11">one compressed stream</text>

  <g stroke="#8b949e" stroke-width="2" fill="none">
    <path d="M180 145 H226" marker-end="url(#aw)"/><path d="M320 145 H366" marker-end="url(#aw)"/>
    <path d="M520 145 H566" marker-end="url(#aw)"/><path d="M660 145 H706" marker-end="url(#aw)"/>
  </g>
  <text x="450" y="232" text-anchor="middle" fill="#e6edf3" font-size="12">In one command: <tspan font-family="Consolas, Menlo, monospace" fill="#2ea043">tar -czf project.tar.gz project/</tspan> &#160;&#160;or as a pipe: <tspan font-family="Consolas, Menlo, monospace" fill="#2ea043">tar -cf - project/ | gzip &gt; project.tar.gz</tspan></text>

  <!-- comparison -->
  <g font-size="12">
    <rect x="30" y="256" width="840" height="28" fill="#21262d"/>
    <text x="46" y="275" fill="#8b949e" font-weight="bold">compressor</text>
    <text x="250" y="275" fill="#8b949e" font-weight="bold">speed</text>
    <text x="420" y="275" fill="#8b949e" font-weight="bold">size</text>
    <text x="580" y="275" fill="#8b949e" font-weight="bold">typical use</text>
    <g font-family="Consolas, Menlo, monospace">
      <text x="46" y="304" fill="#e6edf3">gzip &#160;.gz</text><text x="46" y="326" fill="#e6edf3">xz &#160;&#160;&#160;.xz</text>
      <text x="46" y="348" fill="#e6edf3">zstd &#160;.zst</text><text x="46" y="370" fill="#e6edf3">zip &#160;&#160;.zip</text>
    </g>
    <g fill="#2ea043">
      <rect x="250" y="294" width="90" height="12" rx="3"/><rect x="250" y="316" width="25" height="12" rx="3" fill="#d29922"/>
      <rect x="250" y="338" width="140" height="12" rx="3"/><rect x="250" y="360" width="90" height="12" rx="3"/>
    </g>
    <g fill="#1f6feb">
      <rect x="420" y="294" width="90" height="12" rx="3"/><rect x="420" y="316" width="55" height="12" rx="3"/>
      <rect x="420" y="338" width="70" height="12" rx="3"/><rect x="420" y="360" width="100" height="12" rx="3"/>
    </g>
    <text x="580" y="304" fill="#8b949e">everywhere: logs, HTTP, quick backups</text>
    <text x="580" y="326" fill="#8b949e">releases, kernel sources: smallest files</text>
    <text x="580" y="348" fill="#8b949e">modern default: fast at any level</text>
    <text x="580" y="370" fill="#8b949e">Windows; each file compressed separately</text>
    <text x="450" y="392" text-anchor="middle" fill="#8b949e" font-size="11">longer green bar = faster · shorter blue bar = smaller result (qualitative)</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
