<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="420" fill="#0d1117"/>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Inside a .tar file: 512-byte blocks</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">tar -cf out.tar a.txt (6 bytes) numbers.txt (3 893 bytes)</text>

  <!-- blocks column -->
  <g font-size="12">
    <rect x="30" y="74" width="280" height="40" rx="4" fill="#d29922" opacity="0.85"/>
    <text x="44" y="99" fill="#0d1117" font-weight="bold">header: a.txt</text><text x="296" y="99" text-anchor="end" fill="#0d1117" font-size="11">block 0</text>
    <rect x="30" y="118" width="280" height="40" rx="4" fill="#1f6feb" opacity="0.7"/>
    <rect x="30" y="118" width="20" height="40" rx="4" fill="#1f6feb"/>
    <text x="60" y="143" fill="#e6edf3">"hello\n" + 506 zero bytes</text><text x="296" y="143" text-anchor="end" fill="#e6edf3" font-size="11">1</text>
    <rect x="30" y="162" width="280" height="40" rx="4" fill="#d29922" opacity="0.85"/>
    <text x="44" y="187" fill="#0d1117" font-weight="bold">header: numbers.txt</text><text x="296" y="187" text-anchor="end" fill="#0d1117" font-size="11">2</text>
    <rect x="30" y="206" width="280" height="96" rx="4" fill="#1f6feb"/>
    <text x="44" y="230" fill="#e6edf3">3 893 bytes of data</text>
    <text x="44" y="250" fill="#e6edf3">= 7 full blocks + 309 bytes</text>
    <text x="44" y="270" fill="#e6edf3">→ 8 blocks, last one padded</text>
    <text x="44" y="290" fill="#e6edf3" font-size="11">with zeros</text>
    <text x="296" y="230" text-anchor="end" fill="#e6edf3" font-size="11">3–10</text>
    <rect x="30" y="306" width="280" height="40" rx="4" fill="#21262d" stroke="#8b949e"/>
    <text x="44" y="331" fill="#8b949e">512 zero bytes</text><text x="296" y="331" text-anchor="end" fill="#8b949e" font-size="11">11</text>
    <rect x="30" y="350" width="280" height="40" rx="4" fill="#21262d" stroke="#8b949e"/>
    <text x="44" y="375" fill="#8b949e">512 zero bytes = end of archive</text><text x="296" y="375" text-anchor="end" fill="#8b949e" font-size="11">12</text>
  </g>

  <path d="M310 94 L380 74 M310 94 L380 400" stroke="#d29922" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- header detail -->
  <rect x="380" y="70" width="490" height="330" rx="8" fill="#161b22" stroke="#d29922"/>
  <text x="396" y="92" fill="#d29922" font-size="13" font-weight="bold">ustar header (512 bytes, text fields)</text>
  <g font-size="11.5" font-family="Consolas, Menlo, monospace">
    <text x="396" y="116" fill="#8b949e">offset &#160;size &#160;field &#160;&#160;&#160;&#160;example</text>
    <text x="396" y="138" fill="#e6edf3"> &#160;0 &#160;&#160;&#160;&#160;100 &#160;&#160;name &#160;&#160;&#160;&#160;&#160;a.txt\0...</text>
    <text x="396" y="158" fill="#e6edf3">100 &#160;&#160;&#160;&#160;&#160;&#160;8 &#160;&#160;mode &#160;&#160;&#160;&#160;&#160;0000644\0</text>
    <text x="396" y="178" fill="#e6edf3">108 &#160;&#160;&#160;&#160;&#160;&#160;8 &#160;&#160;uid &#160;&#160;&#160;&#160;&#160;&#160;0001750\0 &#160;&#160;(1000)</text>
    <text x="396" y="198" fill="#e6edf3">116 &#160;&#160;&#160;&#160;&#160;&#160;8 &#160;&#160;gid &#160;&#160;&#160;&#160;&#160;&#160;0001750\0</text>
    <text x="396" y="218" fill="#2ea043">124 &#160;&#160;&#160;&#160;&#160;12 &#160;&#160;size &#160;&#160;&#160;&#160;&#160;00000000006\0</text>
    <text x="396" y="238" fill="#e6edf3">136 &#160;&#160;&#160;&#160;&#160;12 &#160;&#160;mtime &#160;&#160;&#160;&#160;15130142453\0</text>
    <text x="396" y="258" fill="#f85149">148 &#160;&#160;&#160;&#160;&#160;&#160;8 &#160;&#160;chksum &#160;&#160;&#160;0011312\0 + space</text>
    <text x="396" y="278" fill="#e6edf3">156 &#160;&#160;&#160;&#160;&#160;&#160;1 &#160;&#160;typeflag &#160;'0' file, '5' dir</text>
    <text x="396" y="298" fill="#e6edf3">257 &#160;&#160;&#160;&#160;&#160;&#160;6 &#160;&#160;magic &#160;&#160;&#160;&#160;ustar\0</text>
    <text x="396" y="318" fill="#e6edf3">263 &#160;&#160;&#160;&#160;&#160;&#160;2 &#160;&#160;version &#160;&#160;00</text>
    <text x="396" y="338" fill="#e6edf3">265/297 &#160;32 &#160;&#160;uname, gname &#160;&#160;student</text>
  </g>
  <text x="396" y="364" fill="#8b949e" font-size="11.5">numbers: zero-padded OCTAL text, ending in '\0'</text>
  <text x="396" y="382" fill="#8b949e" font-size="11.5">chksum: sum of all 512 bytes, counting chksum itself as 8 spaces</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
