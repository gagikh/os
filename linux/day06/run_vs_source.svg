<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="380" fill="#0d1117"/>
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">./s.sh &#160;vs &#160;source s.sh</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">s.sh contains: &#160;<tspan font-family="Consolas, Menlo, monospace" fill="#e6edf3">cd /tmp; X=42</tspan></text>

  <!-- run -->
  <text x="225" y="84" text-anchor="middle" fill="#d29922" font-size="15" font-weight="bold">./s.sh &#160;&#160;(or bash s.sh)</text>
  <rect x="30" y="96" width="390" height="190" rx="10" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="46" y="118" fill="#2ea043" font-weight="bold" font-size="13">your shell</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#e6edf3">
    <text x="46" y="142">~$ ./s.sh</text>
    <text x="46" y="262">~$ pwd ; echo "[$X]"</text>
    <text x="46" y="278" fill="#2ea043">/home/student &#160;[]</text>
  </g>
  <rect x="200" y="150" width="200" height="86" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="300" y="170" text-anchor="middle" fill="#d29922" font-weight="bold" font-size="12">new bash process</text>
  <text x="300" y="192" text-anchor="middle" fill="#e6edf3" font-size="12" font-family="Consolas, Menlo, monospace">cd /tmp ; X=42</text>
  <text x="300" y="212" text-anchor="middle" fill="#8b949e" font-size="11">changes ITS OWN cwd and vars,</text>
  <text x="300" y="226" text-anchor="middle" fill="#8b949e" font-size="11">then exits: all of it is gone</text>
  <path d="M120 146 C 140 175, 160 190, 196 192" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#aw)"/>
  <text x="225" y="310" text-anchor="middle" fill="#8b949e" font-size="12">use for: programs, tools, anything self-contained</text>

  <!-- source -->
  <text x="675" y="84" text-anchor="middle" fill="#a371f7" font-size="15" font-weight="bold">source s.sh &#160;&#160;(or . s.sh)</text>
  <rect x="480" y="96" width="390" height="190" rx="10" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="496" y="118" fill="#2ea043" font-weight="bold" font-size="13">your shell</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#e6edf3">
    <text x="496" y="142">~$ source s.sh</text>
    <text x="496" y="168" fill="#a371f7"> &#160;&#160;cd /tmp ; X=42 &#160;&#160;&#160;&#160;&#160;← run right here</text>
    <text x="496" y="262">/tmp$ pwd ; echo "[$X]"</text>
    <text x="496" y="278" fill="#a371f7">/tmp &#160;[42]</text>
  </g>
  <text x="675" y="310" text-anchor="middle" fill="#8b949e" font-size="12">use for: ~/.bashrc, venv/bin/activate, ROS setup.bash</text>

  <text x="450" y="348" text-anchor="middle" fill="#e6edf3" font-size="12">Same rule as Day 2: a child process can never change its parent. A sourced file is not a child.</text>
  <text x="450" y="368" text-anchor="middle" fill="#8b949e" font-size="12">That is why "activate" scripts are sourced, and why running them with ./ seems to do nothing.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
