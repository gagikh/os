<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="470" fill="#0d1117"/>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Anatomy of a careful bash script</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">count_lines.sh: how many lines are in the files of a directory</text>

  <rect x="30" y="68" width="520" height="390" rx="8" fill="#161b22" stroke="#30363d"/>
  <g font-family="Consolas, Menlo, monospace" font-size="12">
    <text x="46" y="92" fill="#f0883e">#!/usr/bin/env bash</text>
    <text x="46" y="110" fill="#8b949e"># count_lines.sh DIR &#160;— lines per file</text>
    <text x="46" y="134" fill="#f85149">set -euo pipefail</text>
    <text x="46" y="158" fill="#a371f7">readonly EXIT_USAGE=1</text>
    <text x="46" y="182" fill="#1f6feb">usage() { echo "Usage: $0 DIR" &gt;&amp;2; }</text>
    <text x="46" y="206" fill="#1f6feb">count() {</text>
    <text x="74" y="224" fill="#1f6feb">local file=$1</text>
    <text x="74" y="242" fill="#1f6feb">wc -l &lt; "$file"</text>
    <text x="46" y="260" fill="#1f6feb">}</text>
    <text x="46" y="284" fill="#d29922">[[ $# -eq 1 &amp;&amp; -d $1 ]] || { usage; exit "$EXIT_USAGE"; }</text>
    <text x="46" y="308" fill="#2ea043">total=0</text>
    <text x="46" y="326" fill="#2ea043">for f in "$1"/*; do</text>
    <text x="74" y="344" fill="#2ea043">[[ -f $f ]] || continue</text>
    <text x="74" y="362" fill="#2ea043">n=$(count "$f")</text>
    <text x="74" y="380" fill="#2ea043">printf '%6d %s\n' "$n" "${f##*/}"</text>
    <text x="74" y="398" fill="#2ea043">total=$(( total + n ))</text>
    <text x="46" y="416" fill="#2ea043">done</text>
    <text x="46" y="440" fill="#2ea043">echo "total: $total"</text>
  </g>

  <g font-size="12">
    <text x="570" y="92" fill="#f0883e" font-weight="bold">shebang</text><text x="570" y="108" fill="#8b949e">which interpreter runs the file</text>
    <text x="570" y="134" fill="#f85149" font-weight="bold">strict mode</text><text x="570" y="150" fill="#8b949e">stop on errors, unset vars, failed pipes</text>
    <text x="570" y="174" fill="#a371f7" font-weight="bold">constants</text><text x="570" y="190" fill="#8b949e">named exit codes, not magic numbers</text>
    <text x="570" y="214" fill="#1f6feb" font-weight="bold">functions</text>
    <text x="570" y="230" fill="#8b949e">local variables; arguments are $1, $2</text>
    <text x="570" y="246" fill="#8b949e">"return" data by printing it,</text>
    <text x="570" y="262" fill="#8b949e">catch it with $(count "$f")</text>
    <text x="570" y="284" fill="#d29922" font-weight="bold">check the input first</text>
    <text x="570" y="300" fill="#8b949e">bad arguments: message on stderr, exit ≠ 0</text>
    <text x="570" y="326" fill="#2ea043" font-weight="bold">main logic</text>
    <text x="570" y="342" fill="#8b949e">glob, not $(ls): names with spaces work</text>
    <text x="570" y="358" fill="#8b949e">"$f" quoted everywhere</text>
    <text x="570" y="374" fill="#8b949e">${f##*/}: name without the directory</text>
    <text x="570" y="390" fill="#8b949e">$(( )): integer arithmetic</text>
    <text x="570" y="424" fill="#e6edf3">Check it:</text>
    <text x="570" y="442" fill="#2ea043" font-family="Consolas, Menlo, monospace">bash -n · bash -x · shellcheck</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
