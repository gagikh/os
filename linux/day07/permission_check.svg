<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="420" fill="#0d1117"/>
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2ea043"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">open("report.txt", O_RDONLY): how the kernel decides</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">File: <tspan font-family="Consolas, Menlo, monospace" fill="#e6edf3">-rw-r----- anna lab report.txt</tspan>. Exactly ONE class of bits is checked: the first one that matches.</text>

  <!-- mode bar -->
  <g font-family="Consolas, Menlo, monospace" font-size="22" font-weight="bold" text-anchor="middle">
    <text x="330" y="96" fill="#8b949e">-</text>
    <text x="390" y="96" fill="#d29922">rw-</text>
    <text x="470" y="96" fill="#1f6feb">r--</text>
    <text x="550" y="96" fill="#a371f7">---</text>
  </g>
  <g font-size="11" text-anchor="middle"><text x="390" y="114" fill="#d29922">owner</text><text x="470" y="114" fill="#1f6feb">group</text><text x="550" y="114" fill="#a371f7">other</text></g>

  <!-- decisions -->
  <g font-size="12.5">
    <rect x="40" y="140" width="200" height="46" rx="23" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
    <text x="140" y="168" text-anchor="middle" fill="#e6edf3">effective UID == 0 ?</text>
    <rect x="40" y="216" width="200" height="46" rx="23" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
    <text x="140" y="244" text-anchor="middle" fill="#e6edf3">UID == file owner ?</text>
    <rect x="40" y="292" width="200" height="46" rx="23" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
    <text x="140" y="314" text-anchor="middle" fill="#e6edf3">file group in the</text>
    <text x="140" y="329" text-anchor="middle" fill="#e6edf3">process's groups ?</text>
    <rect x="40" y="360" width="200" height="40" rx="8" fill="#a371f7" opacity="0.3" stroke="#a371f7"/>
    <text x="140" y="385" text-anchor="middle" fill="#e6edf3">use OTHER bits: ---</text>

    <rect x="290" y="140" width="270" height="46" rx="8" fill="#f85149" opacity="0.2" stroke="#f85149"/>
    <text x="304" y="160" fill="#e6edf3">root: allow read/write; exec only if</text>
    <text x="304" y="176" fill="#e6edf3">a dir or some x bit is set</text>
    <rect x="290" y="216" width="270" height="46" rx="8" fill="#d29922" opacity="0.25" stroke="#d29922"/>
    <text x="304" y="244" fill="#e6edf3">use OWNER bits only: rw-</text>
    <rect x="290" y="292" width="270" height="46" rx="8" fill="#1f6feb" opacity="0.25" stroke="#1f6feb"/>
    <text x="304" y="320" fill="#e6edf3">use GROUP bits only: r--</text>
  </g>
  <g stroke-width="2" fill="none">
    <path d="M140 186 V212" stroke="#8b949e" marker-end="url(#aw)"/>
    <path d="M140 262 V288" stroke="#8b949e" marker-end="url(#aw)"/>
    <path d="M140 338 V356" stroke="#8b949e" marker-end="url(#aw)"/>
    <path d="M240 163 H286" stroke="#2ea043" marker-end="url(#ag)"/>
    <path d="M240 239 H286" stroke="#2ea043" marker-end="url(#ag)"/>
    <path d="M240 315 H286" stroke="#2ea043" marker-end="url(#ag)"/>
  </g>
  <g font-size="11"><text x="150" y="204" fill="#8b949e">no</text><text x="150" y="280" fill="#8b949e">no</text><text x="150" y="352" fill="#8b949e">no</text>
    <text x="252" y="156" fill="#2ea043">yes</text><text x="252" y="232" fill="#2ea043">yes</text><text x="252" y="308" fill="#2ea043">yes</text></g>

  <!-- people -->
  <rect x="600" y="140" width="270" height="260" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="616" y="162" fill="#e6edf3" font-size="13" font-weight="bold">Who can read report.txt?</text>
  <g font-size="12">
    <text x="616" y="190" fill="#2ea043">✓ root</text><text x="760" y="190" fill="#8b949e">bits ignored</text>
    <text x="616" y="216" fill="#2ea043">✓ anna</text><text x="760" y="216" fill="#8b949e">owner: rw-</text>
    <text x="616" y="242" fill="#2ea043">✓ aram, in lab</text><text x="760" y="242" fill="#8b949e">group: r--</text>
    <text x="616" y="268" fill="#f85149">✗ guest</text><text x="760" y="268" fill="#8b949e">other: ---</text>
    <line x1="616" y1="284" x2="854" y2="284" stroke="#30363d"/>
    <text x="616" y="306" fill="#e6edf3">Trap: <tspan font-family="Consolas, Menlo, monospace">----r--r--</tspan></text>
    <text x="616" y="326" fill="#8b949e">everybody can read it except the</text>
    <text x="616" y="344" fill="#8b949e">owner: the owner class matched first,</text>
    <text x="616" y="362" fill="#8b949e">and its bits are empty</text>
    <text x="616" y="388" fill="#8b949e">+ every directory on the path needs x</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
