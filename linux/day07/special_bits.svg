<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" fill="#0d1117"/>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">The three special bits: setuid, setgid, sticky</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">They take the place of an x in ls -l: lowercase if x is also set, UPPERCASE (S, T) if it is not</text>

  <g font-size="12">
    <!-- setuid -->
    <rect x="30" y="72" width="270" height="300" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="165" y="98" text-anchor="middle" fill="#f85149" font-size="16" font-weight="bold">setuid · 4000</text>
    <text x="165" y="124" text-anchor="middle" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="13">-rw<tspan fill="#f85149" font-weight="bold">s</tspan>r-xr-x root</text>
    <text x="165" y="142" text-anchor="middle" fill="#8b949e" font-family="Consolas, Menlo, monospace">/usr/bin/passwd</text>
    <text x="46" y="174" fill="#e6edf3">The program runs with the</text>
    <text x="46" y="192" fill="#e6edf3">FILE OWNER's rights.</text>
    <rect x="46" y="206" width="238" height="86" rx="6" fill="#21262d"/>
    <text x="58" y="226" fill="#8b949e">student runs passwd:</text>
    <text x="58" y="246" fill="#e6edf3" font-family="Consolas, Menlo, monospace">real uid &#160;&#160;&#160;&#160;&#160;1000</text>
    <text x="58" y="264" fill="#f85149" font-family="Consolas, Menlo, monospace">effective uid 0</text>
    <text x="58" y="282" fill="#8b949e">→ may write /etc/shadow</text>
    <text x="46" y="318" fill="#8b949e">Any bug becomes a way to root:</text>
    <text x="46" y="336" fill="#8b949e">keep these programs few and tiny.</text>
    <text x="46" y="358" fill="#2ea043" font-family="Consolas, Menlo, monospace" font-size="11">find / -perm -4000 -type f</text>

    <!-- setgid -->
    <rect x="315" y="72" width="270" height="300" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="450" y="98" text-anchor="middle" fill="#d29922" font-size="16" font-weight="bold">setgid · 2000</text>
    <text x="450" y="124" text-anchor="middle" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="13">drwxrw<tspan fill="#d29922" font-weight="bold">s</tspan>--- root lab</text>
    <text x="450" y="142" text-anchor="middle" fill="#8b949e" font-family="Consolas, Menlo, monospace">/srv/lab</text>
    <text x="331" y="174" fill="#e6edf3">On a directory: new files get</text>
    <text x="331" y="192" fill="#e6edf3">the DIRECTORY's group.</text>
    <rect x="331" y="206" width="238" height="86" rx="6" fill="#21262d"/>
    <text x="343" y="226" fill="#8b949e">anna creates /srv/lab/plan.md</text>
    <text x="343" y="246" fill="#e6edf3" font-family="Consolas, Menlo, monospace">without: anna:anna</text>
    <text x="343" y="264" fill="#d29922" font-family="Consolas, Menlo, monospace">with: &#160;&#160;&#160;anna:lab</text>
    <text x="343" y="282" fill="#8b949e">→ the whole team can edit it</text>
    <text x="331" y="318" fill="#8b949e">On a program: runs with the</text>
    <text x="331" y="336" fill="#8b949e">file's group rights.</text>
    <text x="331" y="358" fill="#2ea043" font-family="Consolas, Menlo, monospace" font-size="11">chmod 2775 /srv/lab</text>

    <!-- sticky -->
    <rect x="600" y="72" width="270" height="300" rx="10" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
    <text x="735" y="98" text-anchor="middle" fill="#2ea043" font-size="16" font-weight="bold">sticky · 1000</text>
    <text x="735" y="124" text-anchor="middle" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="13">drwxrwxrw<tspan fill="#2ea043" font-weight="bold">t</tspan> root root</text>
    <text x="735" y="142" text-anchor="middle" fill="#8b949e" font-family="Consolas, Menlo, monospace">/tmp</text>
    <text x="616" y="174" fill="#e6edf3">Everybody may create files,</text>
    <text x="616" y="192" fill="#e6edf3">but delete only THEIR OWN.</text>
    <rect x="616" y="206" width="238" height="86" rx="6" fill="#21262d"/>
    <text x="628" y="226" fill="#8b949e">aram: rm /tmp/anna.log</text>
    <text x="628" y="246" fill="#e6edf3">without t: deleted</text>
    <text x="628" y="264" fill="#2ea043">with t: Operation not permitted</text>
    <text x="628" y="282" fill="#8b949e">(owner, dir owner, root may)</text>
    <text x="616" y="318" fill="#8b949e">Normally w on a directory</text>
    <text x="616" y="336" fill="#8b949e">is enough to delete any file in it.</text>
    <text x="616" y="358" fill="#2ea043" font-family="Consolas, Menlo, monospace" font-size="11">chmod +t /srv/public</text>
  </g>
  <text x="450" y="392" text-anchor="middle" fill="#8b949e" font-size="12">Full mode = special digit + three rwx digits: &#160;4755 = setuid + rwxr-xr-x · &#160;2770 = setgid + rwxrwx--- · &#160;1777 = sticky + rwxrwxrwx</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
