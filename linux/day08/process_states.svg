<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" fill="#0d1117"/>
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">The life of a process</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">The classic five-state model, with the letters Linux shows in the STAT column of ps</text>

  <g font-size="13" text-anchor="middle">
    <ellipse cx="110" cy="150" rx="70" ry="32" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="110" y="155" fill="#e6edf3" font-weight="bold">New</text>
    <ellipse cx="330" cy="150" rx="80" ry="34" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
    <text x="330" y="147" fill="#e6edf3" font-weight="bold">Ready</text><text x="330" y="165" fill="#1f6feb" font-size="12">R</text>
    <ellipse cx="590" cy="150" rx="80" ry="34" fill="#161b22" stroke="#2ea043" stroke-width="2.5"/>
    <text x="590" y="147" fill="#e6edf3" font-weight="bold">Running</text><text x="590" y="165" fill="#2ea043" font-size="12">R</text>
    <ellipse cx="810" cy="150" rx="70" ry="32" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="810" y="147" fill="#e6edf3" font-weight="bold">Terminated</text><text x="810" y="165" fill="#f85149" font-size="12">Z until wait()</text>
    <ellipse cx="460" cy="300" rx="90" ry="34" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="460" y="297" fill="#e6edf3" font-weight="bold">Waiting</text><text x="460" y="315" fill="#d29922" font-size="12">S (or D for disk I/O)</text>
    <ellipse cx="760" cy="300" rx="80" ry="30" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="760" y="297" fill="#e6edf3" font-weight="bold">Stopped</text><text x="760" y="315" fill="#a371f7" font-size="12">T</text>
  </g>

  <g stroke="#8b949e" stroke-width="2" fill="none">
    <path d="M180 150 H246" marker-end="url(#aw)"/>
    <path d="M410 140 H506" marker-end="url(#aw)"/>
    <path d="M510 162 H414" marker-end="url(#aw)"/>
    <path d="M670 150 H736" marker-end="url(#aw)"/>
    <path d="M560 182 L500 268" marker-end="url(#aw)"/>
    <path d="M410 272 L350 186" marker-end="url(#aw)"/>
    <path d="M640 178 C 700 230, 700 270, 682 290" marker-end="url(#aw)"/>
    <path d="M700 322 C 520 380, 360 360, 320 186" stroke-dasharray="5 3" marker-end="url(#aw)"/>
  </g>
  <g font-size="11.5" fill="#8b949e" text-anchor="middle">
    <text x="213" y="140">admitted</text>
    <text x="458" y="132">scheduler picks it</text>
    <text x="462" y="180">time slice over (preempted)</text>
    <text x="703" y="140">exit()</text>
    <text x="566" y="234">read(), sleep(),</text><text x="566" y="248">wait for I/O</text>
    <text x="345" y="234">event happened,</text><text x="345" y="248">data arrived</text>
    <text x="720" y="214">Ctrl+Z, SIGSTOP</text>
    <text x="540" y="372">SIGCONT (fg / bg)</text>
  </g>

  <g font-size="12">
    <rect x="30" y="200" width="230" height="110" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="44" y="222" fill="#e6edf3" font-weight="bold">See it</text>
    <text x="44" y="244" fill="#2ea043" font-family="Consolas, Menlo, monospace" font-size="11">ps -o pid,stat,cmd</text>
    <text x="44" y="264" fill="#2ea043" font-family="Consolas, Menlo, monospace" font-size="11">grep State /proc/PID/status</text>
    <text x="44" y="288" fill="#8b949e" font-size="11">most processes are S almost</text>
    <text x="44" y="302" fill="#8b949e" font-size="11">all the time: waiting is normal</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
