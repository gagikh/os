<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" fill="#0d1117"/>
  <defs>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f0883e"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2ea043"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">kill -TERM 1234: how a signal is delivered</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">A signal can interrupt the program between ANY two instructions. That is why the handler only sets a flag.</text>

  <!-- sender -->
  <rect x="30" y="80" width="170" height="60" rx="8" fill="#161b22" stroke="#8b949e"/>
  <text x="115" y="106" text-anchor="middle" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="13">$ kill 1234</text>
  <text x="115" y="126" text-anchor="middle" fill="#8b949e" font-size="11">or systemctl stop, Ctrl+C</text>

  <!-- kernel -->
  <rect x="250" y="80" width="200" height="60" rx="8" fill="#1f6feb" opacity="0.35" stroke="#1f6feb"/>
  <text x="350" y="104" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-size="13">kernel</text>
  <text x="350" y="124" text-anchor="middle" fill="#e6edf3" font-size="11">marks SIGTERM pending for 1234</text>
  <path d="M200 110 H246" stroke="#f0883e" stroke-width="2" fill="none" marker-end="url(#ao)"/>

  <!-- program timeline -->
  <rect x="30" y="170" width="840" height="150" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="192" fill="#e6edf3" font-size="13" font-weight="bold">process 1234</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12">
    <rect x="46" y="204" width="200" height="100" rx="6" fill="#21262d"/>
    <text x="58" y="224" fill="#8b949e">while (!g_stop) {</text>
    <text x="58" y="244" fill="#e6edf3"> &#160;do_work();</text>
    <text x="58" y="264" fill="#f0883e"> &#160;▶ printf(...)</text>
    <text x="58" y="284" fill="#8b949e"> &#160;...</text>

    <rect x="330" y="204" width="230" height="100" rx="6" fill="#2ea043" opacity="0.25" stroke="#2ea043"/>
    <text x="342" y="224" fill="#2ea043">void on_signal(int) {</text>
    <text x="342" y="244" fill="#e6edf3"> &#160;g_stop = 1;</text>
    <text x="342" y="264" fill="#2ea043">}</text>
    <text x="342" y="290" fill="#8b949e" font-family="Helvetica, Arial, sans-serif" font-size="11">runs on the same thread</text>

    <rect x="640" y="204" width="215" height="100" rx="6" fill="#21262d"/>
    <text x="652" y="224" fill="#e6edf3"> &#160;...printf continues</text>
    <text x="652" y="244" fill="#8b949e">} // loop test sees</text>
    <text x="652" y="264" fill="#e6edf3">save_state();</text>
    <text x="652" y="284" fill="#2ea043">return 0;</text>
  </g>
  <path d="M350 140 C 330 170, 290 230, 250 262" stroke="#f0883e" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
  <path d="M246 262 H326" stroke="#f0883e" stroke-width="2" fill="none" marker-end="url(#ao)"/>
  <path d="M560 254 H636" stroke="#2ea043" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <g font-size="11" fill="#8b949e"><text x="252" y="284">1 · interrupted</text><text x="574" y="246">2 · handler</text><text x="574" y="274">returns</text></g>

  <!-- rules -->
  <g font-size="12">
    <rect x="30" y="336" width="410" height="50" rx="8" fill="#161b22" stroke="#f85149"/>
    <text x="46" y="357" fill="#f85149" font-weight="bold">SIGKILL (9) and SIGSTOP never reach a handler</text>
    <text x="46" y="375" fill="#8b949e">the kernel acts alone: no cleanup, no saved data</text>
    <rect x="460" y="336" width="410" height="50" rx="8" fill="#161b22" stroke="#2ea043"/>
    <text x="476" y="357" fill="#2ea043" font-weight="bold">In the handler: set a volatile sig_atomic_t flag</text>
    <text x="476" y="375" fill="#8b949e">printf / new / mutex there can deadlock: man 7 signal-safety</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
