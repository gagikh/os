<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" fill="#0d1117"/>
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">systemd runs your program as a service</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">Your program stays simple: write to stderr, handle SIGTERM and SIGHUP. systemd does the rest.</text>

  <!-- systemctl commands -->
  <g font-size="12" font-family="Consolas, Menlo, monospace">
    <rect x="30" y="80" width="230" height="250" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="44" y="102" fill="#8b949e" font-family="Helvetica, Arial, sans-serif">you type</text>
    <text x="44" y="134" fill="#2ea043">systemctl start day08</text>
    <text x="44" y="184" fill="#d29922">systemctl reload day08</text>
    <text x="44" y="234" fill="#f85149">systemctl stop day08</text>
    <text x="44" y="284" fill="#1f6feb">journalctl -u day08 -f</text>
  </g>

  <!-- systemd -->
  <rect x="300" y="80" width="220" height="250" rx="10" fill="#1f6feb" opacity="0.25" stroke="#1f6feb" stroke-width="2"/>
  <text x="410" y="106" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-size="14">systemd (PID 1)</text>
  <g font-size="11.5" fill="#e6edf3">
    <text x="314" y="134">fork + exec ExecStart,</text><text x="314" y="150">as the configured user</text>
    <text x="314" y="184">ExecReload: kill -HUP</text>
    <text x="314" y="234">SIGTERM, wait TimeoutStopSec,</text><text x="314" y="250">then SIGKILL</text>
    <text x="314" y="284">stdout + stderr → journal</text>
    <text x="314" y="312" fill="#8b949e">exited with failure? Restart=</text>
  </g>

  <!-- service process -->
  <rect x="560" y="80" width="310" height="250" rx="10" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="715" y="106" text-anchor="middle" fill="#2ea043" font-weight="bold" font-size="14">/opt/day08/day08</text>
  <g font-size="11.5" fill="#e6edf3">
    <text x="576" y="134">main loop: work, log, sleep</text>
    <text x="576" y="184">on SIGHUP: re-read the config</text>
    <text x="576" y="234">on SIGTERM: finish, clean up, exit 0</text>
    <text x="576" y="284">log() writes to stderr</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <path d="M260 130 H296" marker-end="url(#aw)"/><path d="M260 180 H296" marker-end="url(#aw)"/>
    <path d="M260 230 H296" marker-end="url(#aw)"/><path d="M296 280 H264" marker-end="url(#aw)"/>
    <path d="M520 130 H556" marker-end="url(#aw)"/><path d="M520 180 H556" marker-end="url(#aw)"/>
    <path d="M520 230 H556" marker-end="url(#aw)"/><path d="M556 280 H524" marker-end="url(#aw)"/>
  </g>

  <rect x="30" y="346" width="840" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="371" text-anchor="middle" fill="#8b949e" font-size="12">No fork-to-background, no PID file, no log file: those were the old way. <tspan fill="#e6edf3">systemctl enable</tspan> makes it start at every boot.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
