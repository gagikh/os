<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" fill="#0d1117"/>
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#a371f7"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">A device file is a door to a driver</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">It stores no data. Type + major number pick the driver, minor number picks the device inside that driver.</text>

  <g font-size="12">
    <text x="40" y="86" fill="#8b949e">ls -l /dev</text>
    <g font-family="Consolas, Menlo, monospace">
      <rect x="40" y="96" width="300" height="30" rx="5" fill="#161b22" stroke="#30363d"/>
      <text x="52" y="116" fill="#e6edf3"><tspan fill="#d29922">b</tspan>rw-rw---- disk &#160;<tspan fill="#d29922">8, &#160;0</tspan> sda</text>
      <rect x="40" y="132" width="300" height="30" rx="5" fill="#161b22" stroke="#30363d"/>
      <text x="52" y="152" fill="#e6edf3"><tspan fill="#d29922">b</tspan>rw-rw---- disk &#160;<tspan fill="#d29922">8, &#160;1</tspan> sda1</text>
      <rect x="40" y="168" width="300" height="30" rx="5" fill="#161b22" stroke="#30363d"/>
      <text x="52" y="188" fill="#e6edf3"><tspan fill="#2ea043">c</tspan>rw-rw---- dialout <tspan fill="#2ea043">188, 0</tspan> ttyUSB0</text>
      <rect x="40" y="204" width="300" height="30" rx="5" fill="#161b22" stroke="#30363d"/>
      <text x="52" y="224" fill="#e6edf3"><tspan fill="#2ea043">c</tspan>rw-rw-rw- root &#160;<tspan fill="#2ea043">1, &#160;3</tspan> null</text>
    </g>

    <rect x="420" y="96" width="200" height="66" rx="8" fill="#d29922" opacity="0.3" stroke="#d29922"/>
    <text x="520" y="122" text-anchor="middle" fill="#e6edf3" font-weight="bold">block major 8: sd</text>
    <text x="520" y="142" text-anchor="middle" fill="#8b949e" font-size="11">SCSI/SATA disk driver</text>
    <rect x="420" y="168" width="200" height="30" rx="8" fill="#2ea043" opacity="0.3" stroke="#2ea043"/>
    <text x="520" y="188" text-anchor="middle" fill="#e6edf3" font-weight="bold">char major 188: usbserial</text>
    <rect x="420" y="204" width="200" height="30" rx="8" fill="#2ea043" opacity="0.3" stroke="#2ea043"/>
    <text x="520" y="224" text-anchor="middle" fill="#e6edf3" font-weight="bold">char major 1: mem</text>

    <g font-size="11.5" fill="#e6edf3">
      <text x="660" y="116">minor 0 → whole disk</text>
      <text x="660" y="134">minor 1 → partition 1</text>
      <text x="660" y="188">minor 0 → first adapter</text>
      <text x="660" y="224">minor 3 → "discard everything"</text>
    </g>
  </g>
  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <path d="M340 111 H416" marker-end="url(#aw)"/><path d="M340 147 L416 140" marker-end="url(#aw)"/>
    <path d="M340 183 H416" marker-end="url(#aw)"/><path d="M340 219 H416" marker-end="url(#aw)"/>
  </g>
  <text x="520" y="256" text-anchor="middle" fill="#8b949e" font-size="11">active drivers and their majors: cat /proc/devices</text>

  <!-- udev -->
  <rect x="40" y="276" width="830" height="110" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="56" y="298" fill="#a371f7" font-size="13" font-weight="bold">Who creates these files? The kernel (devtmpfs) and udev, when a device appears</text>
  <g font-size="12" text-anchor="middle">
    <rect x="60" y="314" width="150" height="54" rx="6" fill="#21262d"/>
    <text x="135" y="336" fill="#e6edf3">USB plugged in</text><text x="135" y="354" fill="#8b949e" font-size="11">driver binds</text>
    <rect x="260" y="314" width="160" height="54" rx="6" fill="#21262d"/>
    <text x="340" y="336" fill="#e6edf3">kernel: uevent</text><text x="340" y="354" fill="#8b949e" font-size="11">+ /dev/ttyUSB0 node</text>
    <rect x="470" y="314" width="170" height="54" rx="6" fill="#21262d"/>
    <text x="555" y="336" fill="#e6edf3">systemd-udevd</text><text x="555" y="354" fill="#8b949e" font-size="11">reads rules.d/*.rules</text>
    <rect x="690" y="314" width="160" height="54" rx="6" fill="#a371f7" opacity="0.35"/>
    <text x="770" y="336" fill="#e6edf3">GROUP, MODE,</text><text x="770" y="354" fill="#e6edf3" font-family="Consolas, Menlo, monospace" font-size="11">/dev/gps → ttyUSB0</text>
  </g>
  <g stroke="#a371f7" stroke-width="2" fill="none">
    <path d="M210 341 H256" marker-end="url(#ap)"/><path d="M420 341 H466" marker-end="url(#ap)"/><path d="M640 341 H686" marker-end="url(#ap)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
