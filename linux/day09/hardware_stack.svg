<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="430" fill="#0d1117"/>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1f6feb"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f0883e"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">read(fd, buf, 100) on a USB serial port</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">Down: your request travels through the kernel to the device. Up: the data comes back by DMA and an interrupt.</text>

  <g font-size="13">
    <rect x="200" y="70" width="320" height="44" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
    <text x="360" y="90" text-anchor="middle" fill="#e6edf3" font-weight="bold">your program</text>
    <text x="360" y="106" text-anchor="middle" fill="#8b949e" font-size="11" font-family="Consolas, Menlo, monospace">read(fd, buf, 100) &#160;&#160;→ sleeps in state S</text>

    <line x1="200" y1="128" x2="570" y2="128" stroke="#f0883e" stroke-dasharray="7 4" stroke-width="1.5"/>
    <text x="40" y="132" fill="#f0883e" font-size="11">system call: user → kernel</text>

    <rect x="200" y="140" width="320" height="40" rx="8" fill="#1f6feb" opacity="0.3" stroke="#1f6feb"/>
    <text x="360" y="165" text-anchor="middle" fill="#e6edf3">VFS: fd is a char device 188:0</text>
    <rect x="200" y="192" width="320" height="40" rx="8" fill="#1f6feb" opacity="0.55" stroke="#1f6feb"/>
    <text x="360" y="217" text-anchor="middle" fill="#e6edf3">driver: usbserial (major 188)</text>
    <rect x="200" y="244" width="320" height="40" rx="8" fill="#1f6feb" opacity="0.3" stroke="#1f6feb"/>
    <text x="360" y="269" text-anchor="middle" fill="#e6edf3">USB host controller driver (xhci)</text>

    <line x1="200" y1="298" x2="570" y2="298" stroke="#d29922" stroke-dasharray="7 4" stroke-width="1.5"/>
    <text x="40" y="302" fill="#d29922" font-size="11">hardware</text>

    <rect x="200" y="310" width="150" height="44" rx="8" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
    <text x="275" y="337" text-anchor="middle" fill="#e6edf3">USB controller</text>
    <rect x="370" y="310" width="150" height="44" rx="8" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
    <text x="445" y="337" text-anchor="middle" fill="#e6edf3">USB-serial chip</text>
    <rect x="40" y="310" width="130" height="44" rx="8" fill="#21262d" stroke="#8b949e"/>
    <text x="105" y="337" text-anchor="middle" fill="#e6edf3">RAM</text>
  </g>

  <g stroke-width="2" fill="none">
    <path d="M330 114 V136" stroke="#1f6feb" marker-end="url(#ab)"/>
    <path d="M330 180 V188" stroke="#1f6feb" marker-end="url(#ab)"/>
    <path d="M330 232 V240" stroke="#1f6feb" marker-end="url(#ab)"/>
    <path d="M300 284 V306" stroke="#1f6feb" marker-end="url(#ab)"/>
    <path d="M350 332 H366" stroke="#1f6feb" marker-end="url(#ab)"/>
    <path d="M200 340 H174" stroke="#f0883e" marker-end="url(#ao)"/>
    <path d="M275 354 C 275 400, 620 400, 640 300 S 600 100, 524 92" stroke="#f0883e" stroke-dasharray="6 4" marker-end="url(#ao)"/>
  </g>
  <g font-size="11.5">
    <text x="40" y="378" fill="#f0883e">DMA: data copied into RAM</text>
    <text x="630" y="388" fill="#f0883e">interrupt: "data ready"</text>
    <text x="660" y="230" fill="#f0883e">driver's interrupt handler</text>
    <text x="660" y="246" fill="#f0883e">wakes the sleeping process;</text>
    <text x="660" y="262" fill="#f0883e">read() returns the bytes</text>
  </g>

  <rect x="660" y="70" width="210" height="110" rx="8" fill="#161b22" stroke="#30363d"/>
  <g font-size="11.5">
    <text x="674" y="92" fill="#e6edf3" font-weight="bold">Same read(), any device</text>
    <text x="674" y="112" fill="#8b949e">disk, serial port, camera, GPIO:</text>
    <text x="674" y="128" fill="#8b949e">the driver hides the details</text>
    <text x="674" y="150" fill="#8b949e">drivers are more than half of</text>
    <text x="674" y="166" fill="#8b949e">the Linux kernel's code</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
