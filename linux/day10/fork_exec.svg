<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="440" fill="#0d1117"/>
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">fork → exec → wait</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">How a shell runs &#160;ls -l /</text>

  <!-- parent -->
  <rect x="40" y="80" width="230" height="74" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <text x="155" y="104" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-size="14">shell (parent)</text>
  <text x="155" y="124" text-anchor="middle" fill="#8b949e" font-size="12">PID 1000</text>
  <text x="155" y="142" text-anchor="middle" fill="#1f6feb" font-family="Consolas, monospace" font-size="12">pid = fork()</text>

  <!-- fork arrows -->
  <path d="M155 154 V210" stroke="#1f6feb" stroke-width="2" fill="none" marker-end="url(#aw)"/>
  <path d="M270 117 H420" stroke="#2ea043" stroke-width="2" fill="none" marker-end="url(#aw)"/>
  <text x="345" y="108" text-anchor="middle" fill="#2ea043" font-size="12">copy (copy-on-write)</text>

  <!-- parent continues -->
  <rect x="40" y="214" width="230" height="74" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <text x="155" y="238" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-size="13">parent: fork returned 1234</text>
  <text x="155" y="262" text-anchor="middle" fill="#1f6feb" font-family="Consolas, monospace" font-size="12">waitpid(1234, &amp;status, 0)</text>
  <text x="155" y="279" text-anchor="middle" fill="#8b949e" font-size="11">sleeps until the child ends</text>

  <!-- child -->
  <rect x="424" y="80" width="200" height="74" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="524" y="104" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-size="13">child: fork returned 0</text>
  <text x="524" y="124" text-anchor="middle" fill="#8b949e" font-size="12">PID 1234 · still the shell code</text>
  <text x="524" y="142" text-anchor="middle" fill="#2ea043" font-family="Consolas, monospace" font-size="12">execvp("ls", argv)</text>

  <path d="M624 117 H690" stroke="#a371f7" stroke-width="2" fill="none" marker-end="url(#aw)"/>

  <!-- after exec -->
  <rect x="694" y="80" width="180" height="74" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="784" y="104" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-size="13">ls</text>
  <text x="784" y="124" text-anchor="middle" fill="#8b949e" font-size="12">PID 1234 · new program</text>
  <text x="784" y="142" text-anchor="middle" fill="#a371f7" font-size="12">same PID, fds, environment</text>

  <path d="M784 154 V210" stroke="#a371f7" stroke-width="2" fill="none" marker-end="url(#aw)"/>
  <rect x="694" y="214" width="180" height="74" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="784" y="238" text-anchor="middle" fill="#e6edf3" font-weight="bold" font-size="13">exit(0)</text>
  <text x="784" y="258" text-anchor="middle" fill="#f85149" font-size="12">zombie (Z) until</text>
  <text x="784" y="275" text-anchor="middle" fill="#f85149" font-size="12">the parent reads status</text>

  <path d="M694 251 H274" stroke="#d29922" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#aw)"/>
  <text x="484" y="243" text-anchor="middle" fill="#d29922" font-size="12">status → WEXITSTATUS = 0 → $?</text>

  <!-- notes -->
  <rect x="40" y="318" width="834" height="100" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="344" fill="#e6edf3" font-size="13" font-weight="bold">Between fork and exec the child can prepare the new program:</text>
  <text x="60" y="366" fill="#8b949e" font-size="12">chdir · setenv · dup2(fd, 1) for &#160;&gt; &#160;and &#160;| &#160;· drop privileges — exec keeps all of it</text>
  <text x="60" y="390" fill="#8b949e" font-size="12">exec failed? &#160;print the error, then &#160;_exit(127) &#160;— the shell shows "command not found", $? = 127</text>
  <text x="60" y="410" fill="#8b949e" font-size="12">Killed by a signal? &#160;WIFSIGNALED, WTERMSIG = 9 &#160;→ &#160;$? = 128 + 9 = 137</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
