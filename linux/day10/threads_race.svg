<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="470" fill="#0d1117"/>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Processes, threads and a race condition</text>

  <!-- two processes -->
  <text x="225" y="62" text-anchor="middle" fill="#8b949e" font-size="13">Two processes: separate memory</text>
  <rect x="40" y="74" width="170" height="106" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <rect x="240" y="74" width="170" height="106" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <g font-size="12" fill="#e6edf3" text-anchor="middle">
    <text x="125" y="96" font-weight="bold">process A</text>
    <text x="125" y="118">code · data · heap</text><text x="125" y="138">open files</text><text x="125" y="158" fill="#d29922">stack · registers</text>
    <text x="325" y="96" font-weight="bold">process B</text>
    <text x="325" y="118">code · data · heap</text><text x="325" y="138">open files</text><text x="325" y="158" fill="#d29922">stack · registers</text>
  </g>
  <text x="225" y="202" text-anchor="middle" fill="#8b949e" font-size="11">talk via pipe, socket, shared memory</text>

  <!-- one process two threads -->
  <text x="670" y="62" text-anchor="middle" fill="#8b949e" font-size="13">One process, two threads: shared memory</text>
  <rect x="490" y="74" width="360" height="130" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <rect x="510" y="86" width="320" height="50" rx="6" fill="#0d1117" stroke="#2ea043"/>
  <text x="670" y="106" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="bold">shared: code · data · heap · open files</text>
  <text x="670" y="124" text-anchor="middle" fill="#2ea043" font-family="Consolas, monospace" font-size="12">long counter;</text>
  <rect x="510" y="146" width="150" height="46" rx="6" fill="#0d1117" stroke="#d29922"/>
  <rect x="680" y="146" width="150" height="46" rx="6" fill="#0d1117" stroke="#d29922"/>
  <text x="585" y="166" text-anchor="middle" fill="#e6edf3" font-size="12">thread 1</text><text x="585" y="183" text-anchor="middle" fill="#d29922" font-size="11">own stack · registers</text>
  <text x="755" y="166" text-anchor="middle" fill="#e6edf3" font-size="12">thread 2</text><text x="755" y="183" text-anchor="middle" fill="#d29922" font-size="11">own stack · registers</text>

  <!-- race -->
  <text x="40" y="240" fill="#e6edf3" font-size="14" font-weight="bold">++counter is three steps — without a mutex one update is lost</text>
  <g font-family="Consolas, monospace" font-size="12">
    <text x="60" y="266" fill="#8b949e">time</text><text x="170" y="266" fill="#8b949e">thread 1</text><text x="380" y="266" fill="#8b949e">thread 2</text><text x="580" y="266" fill="#8b949e">counter in RAM</text>
    <text x="60" y="290" fill="#8b949e">1</text><text x="170" y="290" fill="#1f6feb">load &#160;r = 5</text><text x="580" y="290" fill="#e6edf3">5</text>
    <text x="60" y="312" fill="#8b949e">2</text><text x="380" y="312" fill="#a371f7">load &#160;r = 5</text><text x="580" y="312" fill="#e6edf3">5</text>
    <text x="60" y="334" fill="#8b949e">3</text><text x="170" y="334" fill="#1f6feb">add &#160;&#160;r = 6</text><text x="380" y="334" fill="#a371f7">add &#160;&#160;r = 6</text><text x="580" y="334" fill="#e6edf3">5</text>
    <text x="60" y="356" fill="#8b949e">4</text><text x="170" y="356" fill="#1f6feb">store 6</text><text x="580" y="356" fill="#e6edf3">6</text>
    <text x="60" y="378" fill="#8b949e">5</text><text x="380" y="378" fill="#a371f7">store 6</text><text x="580" y="378" fill="#f85149">6 &#160;(should be 7)</text>
  </g>
  <rect x="40" y="398" width="820" height="56" rx="8" fill="#161b22" stroke="#2ea043"/>
  <text x="60" y="422" fill="#2ea043" font-size="13" font-weight="bold">With a mutex:</text>
  <text x="170" y="422" fill="#e6edf3" font-family="Consolas, monospace" font-size="12">std::lock_guard&lt;std::mutex&gt; lock(m); ++counter;</text>
  <text x="60" y="443" fill="#8b949e" font-size="12">thread 2 waits at lock() until thread 1 has stored 6, then loads 6 and stores 7. Only one thread is inside the critical section.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
