<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="430" fill="#0d1117"/>
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">What happens to send(fd, "hi", 2)</text>
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="12">Each layer adds its header; the receiving kernel removes them and picks the socket by destination port</text>

  <g font-size="12">
    <text x="40" y="96" fill="#e6edf3" font-weight="bold">Application</text>
    <rect x="600" y="80" width="120" height="26" rx="4" fill="#161b22" stroke="#a371f7"/><text x="660" y="98" text-anchor="middle" fill="#a371f7" font-family="Consolas, monospace">"hi"</text>
    <text x="740" y="98" fill="#8b949e">your data</text>

    <text x="40" y="146" fill="#e6edf3" font-weight="bold">Transport (TCP)</text>
    <rect x="420" y="130" width="176" height="26" rx="4" fill="#161b22" stroke="#2ea043"/><text x="508" y="148" text-anchor="middle" fill="#2ea043">port 43122 → 5555</text>
    <rect x="600" y="130" width="120" height="26" rx="4" fill="#161b22" stroke="#a371f7"/><text x="660" y="148" text-anchor="middle" fill="#a371f7" font-family="Consolas, monospace">"hi"</text>
    <text x="740" y="148" fill="#8b949e">which program</text>

    <text x="40" y="196" fill="#e6edf3" font-weight="bold">Network (IP)</text>
    <rect x="200" y="180" width="216" height="26" rx="4" fill="#161b22" stroke="#1f6feb"/><text x="308" y="198" text-anchor="middle" fill="#1f6feb">192.168.1.10 → 192.168.1.20</text>
    <rect x="420" y="180" width="176" height="26" rx="4" fill="#161b22" stroke="#2ea043"/><text x="508" y="198" text-anchor="middle" fill="#2ea043">port 43122 → 5555</text>
    <rect x="600" y="180" width="120" height="26" rx="4" fill="#161b22" stroke="#a371f7"/><text x="660" y="198" text-anchor="middle" fill="#a371f7" font-family="Consolas, monospace">"hi"</text>
    <text x="740" y="198" fill="#8b949e">which computer</text>

    <text x="40" y="246" fill="#e6edf3" font-weight="bold">Link (Ethernet)</text>
    <rect x="150" y="230" width="46" height="26" rx="4" fill="#161b22" stroke="#d29922"/><text x="173" y="248" text-anchor="middle" fill="#d29922">MAC</text>
    <rect x="200" y="230" width="216" height="26" rx="4" fill="#161b22" stroke="#1f6feb"/><text x="308" y="248" text-anchor="middle" fill="#1f6feb">192.168.1.10 → 192.168.1.20</text>
    <rect x="420" y="230" width="176" height="26" rx="4" fill="#161b22" stroke="#2ea043"/><text x="508" y="248" text-anchor="middle" fill="#2ea043">port 43122 → 5555</text>
    <rect x="600" y="230" width="120" height="26" rx="4" fill="#161b22" stroke="#a371f7"/><text x="660" y="248" text-anchor="middle" fill="#a371f7" font-family="Consolas, monospace">"hi"</text>
    <text x="740" y="248" fill="#8b949e">which device on the LAN</text>
  </g>

  <path d="M450 270 V300" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#aw)"/>
  <text x="465" y="290" fill="#8b949e" font-size="12">cable / Wi-Fi</text>

  <rect x="40" y="310" width="820" height="100" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="336" fill="#e6edf3" font-size="13" font-weight="bold">Receiving kernel (192.168.1.20)</text>
  <text x="60" y="360" fill="#8b949e" font-size="12">MAC is mine → IP is mine → TCP port 5555 belongs to the socket of process "day11" → recv() returns "hi"</text>
  <text x="60" y="384" fill="#8b949e" font-size="12">The program never sees the headers. It only reads and writes bytes through a file descriptor.</text>
  <text x="60" y="402" fill="#8b949e" font-size="12">Port 5555 has no listener? &#160;The kernel answers with a reset → connect() fails with ECONNREFUSED.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
