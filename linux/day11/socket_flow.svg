<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="500" fill="#0d1117"/>
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f0883e"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">TCP server and client: the system calls</text>
  <text x="200" y="64" text-anchor="middle" fill="#1f6feb" font-size="15" font-weight="bold">server</text>
  <text x="700" y="64" text-anchor="middle" fill="#2ea043" font-size="15" font-weight="bold">client</text>

  <g font-family="Consolas, monospace" font-size="13" text-anchor="middle">
    <rect x="110" y="80" width="180" height="32" rx="6" fill="#161b22" stroke="#1f6feb"/><text x="200" y="101" fill="#e6edf3">socket()</text>
    <rect x="110" y="126" width="180" height="32" rx="6" fill="#161b22" stroke="#1f6feb"/><text x="200" y="147" fill="#e6edf3">bind(:5555)</text>
    <rect x="110" y="172" width="180" height="32" rx="6" fill="#161b22" stroke="#1f6feb"/><text x="200" y="193" fill="#e6edf3">listen()</text>
    <rect x="110" y="218" width="180" height="32" rx="6" fill="#161b22" stroke="#d29922"/><text x="200" y="239" fill="#e6edf3">accept() &#160;waits…</text>
    <rect x="110" y="290" width="180" height="32" rx="6" fill="#161b22" stroke="#1f6feb"/><text x="200" y="311" fill="#e6edf3">recv(cfd)</text>
    <rect x="110" y="350" width="180" height="32" rx="6" fill="#161b22" stroke="#1f6feb"/><text x="200" y="371" fill="#e6edf3">send(cfd)</text>
    <rect x="110" y="420" width="180" height="32" rx="6" fill="#161b22" stroke="#1f6feb"/><text x="200" y="441" fill="#e6edf3">recv → 0, close</text>

    <rect x="610" y="172" width="180" height="32" rx="6" fill="#161b22" stroke="#2ea043"/><text x="700" y="193" fill="#e6edf3">socket()</text>
    <rect x="610" y="218" width="180" height="32" rx="6" fill="#161b22" stroke="#2ea043"/><text x="700" y="239" fill="#e6edf3">connect(ip:5555)</text>
    <rect x="610" y="290" width="180" height="32" rx="6" fill="#161b22" stroke="#2ea043"/><text x="700" y="311" fill="#e6edf3">send(fd)</text>
    <rect x="610" y="350" width="180" height="32" rx="6" fill="#161b22" stroke="#2ea043"/><text x="700" y="371" fill="#e6edf3">recv(fd)</text>
    <rect x="610" y="420" width="180" height="32" rx="6" fill="#161b22" stroke="#2ea043"/><text x="700" y="441" fill="#e6edf3">close(fd)</text>
  </g>

  <g stroke="#8b949e" stroke-width="1.5" fill="none">
    <path d="M200 112 V122" marker-end="url(#aw)"/><path d="M200 158 V168" marker-end="url(#aw)"/><path d="M200 204 V214" marker-end="url(#aw)"/>
    <path d="M200 250 V286" marker-end="url(#aw)"/><path d="M200 322 V346" marker-end="url(#aw)"/><path d="M200 382 V416" marker-end="url(#aw)"/>
    <path d="M700 204 V214" marker-end="url(#aw)"/><path d="M700 250 V286" marker-end="url(#aw)"/><path d="M700 322 V346" marker-end="url(#aw)"/><path d="M700 382 V416" marker-end="url(#aw)"/>
  </g>
  <g stroke="#f0883e" stroke-width="2" fill="none">
    <path d="M606 234 H294" marker-end="url(#ao)"/>
    <path d="M606 306 H294" marker-end="url(#ao)"/>
    <path d="M294 366 H606" marker-end="url(#ao)"/>
    <path d="M606 436 H294" marker-end="url(#ao)" stroke-dasharray="6 4"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="450" y="226" fill="#f0883e">TCP handshake</text>
    <text x="450" y="254" fill="#d29922">accept returns a NEW fd (cfd) for this client;</text>
    <text x="450" y="268" fill="#d29922">the listening socket keeps listening</text>
    <text x="450" y="298" fill="#f0883e">"hello"</text>
    <text x="450" y="358" fill="#f0883e">"hello" &#160;(echo)</text>
    <text x="450" y="428" fill="#f0883e">FIN: connection closed</text>
  </g>
  <text x="450" y="482" text-anchor="middle" fill="#8b949e" font-size="12">recv returns 0 when the other side closed the connection — the same idea as EOF on a pipe (Day 4)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
